      summary: Tahap 2 login admin — verifikasi TOTP, terbitkan sesi
      description: >-
        Kode TOTP 6 digit diverifikasi terhadap jendela ±1 langkah, dan satu langkah waktu tidak dapat dipakai dua kali. Bila ini enrollment pertama, secret TOTP baru disimpan (terenkripsi AES-256-GCM) dan 10 kode pemulihan dikembalikan **sekali** dalam respons ini. Challenge hangus setelah 5 menit atau 5 percobaan gagal. Cookie `rentalio_platform_admin` (HttpOnly, host-only, SameSite=Lax) hanya diterbitkan setelah MFA berhasil.
