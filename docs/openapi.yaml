    x-implementation-status: implemented
    get:
      tags: [ Billing ]
      operationId: listSubscriptionInvoices
      x-required-permission: settings.subscription.manage
      summary: Riwayat tagihan langganan tenant (terbaru lebih dulu)
      description: >-
        Memerlukan `settings.subscription.manage` (OWNER selalu memiliki). Mengembalikan maksimum 10 tagihan. Status tagihan **tidak** berubah otomatis: QRIS dinamis tidak punya callback, dan `PAID` hanya ditetapkan operator platform setelah dana terverifikasi.
