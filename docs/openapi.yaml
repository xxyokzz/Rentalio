openapi: 3.1.1

info:
  title: Rentalio API
  description: |
    REST API Rentalio — platform manajemen penyewaan multi-tenant.

    ## Autentikasi & Sesi
    Autentikasi berbasis cookie HttpOnly (`rentalio_session`). Semua mutasi
    memerlukan header **`X-CSRF-Token`** yang diterima saat login.

    ## Tenant Isolation
    Semua resource operasional diakses melalui path `/tenants/{tenantId}/...`.
    Server menerapkan RLS PostgreSQL: tanpa `tenantId` yang cocok, query
    gagal tertutup (_fail-closed_).

    ## Format Nilai Uang
    Semua nilai uang (harga, deposit, denda) adalah **integer IDR rupiah utuh**
    (bukan float). Representasi JSON: string numerik untuk menghindari presisi
    float (BigInt).

    ## Error Envelope
    ```json
    {
      "error": {
        "code": "ERROR_CODE",
        "message": "Pesan deskriptif",
        "request_id": "uuid-korelasi-request"
      }
    }
    ```
    `request_id` identik dengan header respons `X-Correlation-ID`.

    ## Status Implementasi
    Setiap path menandai kesiapannya melalui `x-implementation-status`:
    `implemented` berarti endpoint sudah memiliki implementasi dan integration
    test; `future` berarti kontrak sudah ditetapkan tetapi belum ada kode.
    Jalankan `pnpm openapi:validate` untuk memvalidasi dokumen ini terhadap
    skema OpenAPI 3.1 dan aturan internal di atas.

  version: "1.0.0"
  contact:
    name: Tim Rentalio

servers:
  - url: http://localhost:3000/api/v1
    description: Development lokal
  - url: https://api.rentalio.my.id/api/v1
    description: Production

# ============================================================
# Security schemes
# ============================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rentalio_session
      description: Session token HttpOnly. Diperoleh saat POST /auth/sessions.
    platformAdminCookie:
      type: apiKey
      in: cookie
      name: rentalio_platform_admin
      description: >-
        Session token Admin Platform, HttpOnly dan **host-only** untuk origin aplikasi admin. Diperoleh hanya setelah password + TOTP terverifikasi. Cookie ini tidak pernah berlaku untuk origin tenant, dan `rentalio_session` tidak pernah diterima sebagai bukti identitas admin.
    cronBearer:
      type: http
      scheme: bearer
      description: >-
        Shared secret untuk endpoint operasional `/internal/cron`. Scheduler mengirim `Authorization: Bearer <CRON_SECRET>`; endpoint status menerima `CRON_STATUS_TOKEN` bila diatur, atau jatuh ke `CRON_SECRET`. Perbandingan dilakukan timing-safe, dan bila secret belum dikonfigurasi endpoint menolak semua request (503) alih-alih terbuka.

  # ============================================================
  # Reusable schemas
  # ============================================================
  schemas:
    ErrorBody:
      type: object
      required: [ error ]
      properties:
        error:
          type: object
          required: [ code, message, request_id ]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - OTP_INVALID_OR_EXPIRED
                - RESET_TOKEN_INVALID_OR_EXPIRED
                - INVITATION_INVALID_OR_EXPIRED
                - PERMISSION_DENIED
                - CSRF_VALIDATION_FAILED
                - NOT_FOUND
                - INVALID_STATE_TRANSITION
                - AVAILABILITY_CONFLICT
                - IDEMPOTENCY_KEY_REUSED
                - BUSINESS_RULE_VIOLATION
                - TENANT_RESTRICTED
                - BILLING_NOT_CONFIGURED
                - PAYMENT_PROVIDER_ERROR
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
              description: Pesan deskriptif dalam bahasa Indonesia
            request_id:
              type: string
              format: uuid
              description: Identik dengan header X-Correlation-ID
            details:
              description: >-
                Detail aman untuk keputusan pengguna, misalnya daftar konflik perpanjangan. Tidak pernah memuat stack trace, SQL, atau rahasia.
              oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  items: {}

    # --- Auth ---
    RegisterRequest:
      type: object
      required: [ email, password, termsAccepted, termsVersion, privacyVersion ]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        ownerName:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Opsional — nama pemilik akun (dokumen 04). Disimpan sebagai prefill pada onboarding; dapat juga dilengkapi saat onboarding.
        tenantName:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Opsional — nama usaha. Disimpan sebagai prefill nama toko pada onboarding; dapat juga dilengkapi saat onboarding.
        tenantSlug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: >-
            Opsional — usulan link katalog (huruf kecil, angka, tanda hubung) sebagai prefill onboarding. Keunikan ditegakkan `POST /tenants`, sehingga slug yang sudah dipakai tenant lain ditolak 409 saat onboarding, bukan saat mendaftar.
        termsAccepted:
          type: boolean
          enum: [ true ]
          description: >-
            Persetujuan Syarat Layanan. Wajib `true`; backend menyimpan bukti versi dokumen + waktu penerimaan di server (dokumen 04).
        termsVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
          description: Identitas versi Syarat Layanan yang dilihat pengguna.
        privacyVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
          description: Identitas versi Kebijakan Privasi yang dilihat pengguna.

    VerifyEmailRequest:
      type: object
      required: [ email, code ]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
          description: Kode OTP 6 digit

    ResendOtpRequest:
      type: object
      required: [ email ]
      properties:
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    SessionResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            email:
              type: string
              format: email
            ownerName:
              type: [ string, 'null' ]
              maxLength: 120
              description: Prefill nama pemilik dari pendaftaran; `null` bila tidak diisi.
            tenantName:
              type: [ string, 'null' ]
              maxLength: 100
              description: Prefill nama usaha dari pendaftaran; `null` bila tidak diisi.
            tenantSlug:
              type: [ string, 'null' ]
              minLength: 3
              maxLength: 63
              pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
              description: Usulan link katalog dari pendaftaran untuk prefill onboarding; `null` bila tidak diisi.

    PasswordResetRequest:
      type: object
      required: [ email ]
      properties:
        email:
          type: string
          format: email

    CompletePasswordResetRequest:
      type: object
      required: [ token, newPassword ]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 12
          maxLength: 128

    AcceptInvitationRequest:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
          maxLength: 256
          description: Token undangan mentah dari tautan email (sekali pakai, 7 hari)
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: >-
            Wajib bila email belum punya akun. Tidak pernah mengubah password akun yang sudah ada.

    # --- Tenant ---
    CreateTenantRequest:
      type: object
      required: [ name, slug ]
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: Huruf kecil, angka, tanda hubung; tanpa spasi
        timezone:
          type: string
          default: Asia/Jakarta
          example: Asia/Jakarta

    TenantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        timezone:
          type: string
        status:
          type: string
          enum: [ PENDING_ACTIVATION, ACTIVE, SUSPENDED, CLOSED ]
        bookingMode:
          type: string
          enum: [ MANUAL, AUTOMATIC ]
        catalogPolicy:
          type: string
          enum: [ CHECK_AVAILABILITY, SKIP_AVAILABILITY ]
        rentalExtensionEnabled:
          type: boolean
        whatsappNumber:
          type: string
          nullable: true
          description: Nomor click-to-chat; null bila belum diatur.
        bankTransferInstructions:
          type: string
          nullable: true
        qrisImageUrl:
          type: string
          nullable: true
          format: uri
        lateFeeEnabled:
          type: boolean
          description: Saklar denda keterlambatan pengembalian milik tenant.
        lateFeeUnit:
          type: string
          enum: [ DAY, HOUR ]
          description: Satuan perhitungan denda yang dipilih owner.
        lateFeeRateAmount:
          type: string
          description: Tarif denda per satuan, IDR rupiah utuh (string agar aman untuk nilai besar).
        damageInspectionEnabled:
          type: boolean
          description: Saklar alur inspeksi kerusakan pasca-return milik tenant.
        damageFeeEnabled:
          type: boolean
          description: Saklar usulan denda kondisi barang; nominal tetap tersimpan saat dimatikan.
        damageFeeMinorAmount:
          type: string
          description: Nominal denda kondisi ringan, IDR rupiah utuh (string).
        damageFeeModerateAmount:
          type: string
          description: Nominal denda kondisi sedang, IDR rupiah utuh (string).
        damageFeeSevereAmount:
          type: string
          description: Nominal denda kondisi parah, IDR rupiah utuh (string).
        damageFeeMaxAmount:
          type: [ string, 'null' ]
          description: Plafon usulan denda kondisi per inspeksi; null berarti tanpa plafon.
        damagePenaltyOrderMaxAmount:
          type: [ string, 'null' ]
          description: Batas total denda aktif per order; null berarti tanpa batas.
        activatedAt:
          type: string
          format: date-time
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        subscription:
          $ref: '#/components/schemas/TenantSubscription'
        billing:
          $ref: '#/components/schemas/TenantBillingInfo'

    TenantBillingInfo:
      type: object
      required: [ paymentEnabled, periodDays ]
      description: >-
        Konfigurasi pembayaran langganan yang tersedia untuk tenant ini. `paymentEnabled` false berarti provider/pembayaran belum dikonfigurasi server; UI menampilkan jalur manual (hubungi tim) dan tidak menawarkan tombol bayar.
      properties:
        paymentEnabled: { type: boolean }
        priceAmount:
          type: [ string, 'null' ]
          description: Harga satu periode dalam rupiah utuh (string); null bila belum diatur.
          example: '149000'
        periodDays:
          type: integer
          minimum: 1
          example: 30

    SubscriptionInvoiceResponse:
      type: object
      required: [ id, status, provider, amount, currency, expiresAt, createdAt ]
      description: >-
        Tagihan langganan tenant → Rentalio lewat QRIS dinamis. `qrPayload` adalah string QRIS dengan nominal tertanam; `qrImageDataUrl` adalah gambar QR siap tampil. QRIS tidak memiliki callback pembayaran: status `PAID` hanya ditetapkan operator platform melalui Admin Platform setelah dana terverifikasi.
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [ PENDING, PAID, EXPIRED, FAILED ]
        provider: { type: string, example: qris }
        amount:
          type: string
          description: Harga tagihan dalam rupiah utuh sebagai string (hindari presisi float).
          example: '149000'
        currency: { type: string, example: IDR }
        qrPayload:
          type: [ string, 'null' ]
          description: String QRIS dinamis (nominal tertanam); `null` untuk tagihan lama tanpa payload QR.
        qrImageDataUrl:
          type: [ string, 'null' ]
          description: Gambar QR sebagai data URL PNG; hanya diisi untuk tagihan `PENDING` yang memiliki payload.
        expiresAt:
          type: string
          format: date-time
          description: Batas waktu pembayaran tagihan.
        paidAt:
          type: [ string, 'null' ]
          format: date-time
        paidAmount:
          type: [ string, 'null' ]
          description: Jumlah yang benar-benar diterima (string rupiah utuh).
        paymentMethod:
          type: [ string, 'null' ]
          example: QRIS
        paymentChannel:
          type: [ string, 'null' ]
          example: QRIS
        createdAt: { type: string, format: date-time }

    TenantSubscription:
      type: object
      required: [ status, restricted, reason ]
      description: >-
        Status langganan efektif yang dihitung server dengan policy yang sama seperti guard
        (`SubscriptionPolicyService.compute`). `restricted: true` berarti command katalog/transaksi
        ditolak `403 TENANT_RESTRICTED`. Klien memakai nilai ini untuk menampilkan mode terbatas;
        jangan menghitung ulang dari tanggal trial di browser.
      properties:
        status:
          type: string
          enum: [ TRIALING, ACTIVE, PAST_DUE, RESTRICTED, CANCELLED, EXPIRED, NONE ]
        restricted:
          type: boolean
          description: True bila tenant sedang dibatasi (trial/grace habis atau subscription tidak aktif).
        reason:
          type: string
          enum:
            - TRIAL
            - ACTIVE_SUBSCRIPTION
            - GRACE_PERIOD
            - TRIAL_EXPIRED
            - GRACE_EXPIRED
            - SUBSCRIPTION_RESTRICTED
            - SUBSCRIPTION_CANCELLED
            - SUBSCRIPTION_EXPIRED
            - NO_ENTITLEMENT
        trialEndsAt:
          type: [ string, 'null' ]
          format: date-time
          description: Akhir trial efektif (subscription bila ada, selain itu tenant).
        graceEndsAt:
          type: [ string, 'null' ]
          format: date-time
          description: Akhir masa tenggang renewal gagal; null bila tidak ada grace.
        periodEnd:
          type: [ string, 'null' ]
          format: date-time
          description: Akhir periode berbayar yang tersimpan pada subscription.

    UpdateTenantSettingsRequest:
      type: object
      properties:
        bookingMode:
          type: string
          enum: [ MANUAL, AUTOMATIC ]
        catalogPolicy:
          type: string
          enum: [ CHECK_AVAILABILITY, SKIP_AVAILABILITY ]
        rentalExtensionEnabled:
          type: boolean
        whatsappNumber:
          type: string
          maxLength: 24
          description: >-
            Nomor WhatsApp click-to-chat. String kosong menghapus nilai; server menyimpannya sebagai null.
        bankTransferInstructions:
          type: string
          maxLength: 1000
          description: Instruksi transfer bank; string kosong menghapus nilai.
        qrisImageUrl:
          type: string
          format: uri
          maxLength: 2000
          description: URL gambar QRIS publik; string kosong menghapus nilai.
        lateFeeEnabled:
          type: boolean
          description: Saklar denda keterlambatan; wajib disertai tarif lebih dari 0.
        lateFeeUnit:
          type: string
          enum: [ DAY, HOUR ]
          description: Satuan perhitungan denda, per hari atau per jam.
        lateFeeRateAmount:
          type: integer
          minimum: 0
          description: Tarif denda per satuan dalam IDR rupiah utuh.
        damageInspectionEnabled:
          type: boolean
          description: Saklar alur inspeksi kerusakan; wajib aktif sebelum denda kondisi diaktifkan.
        damageFeeEnabled:
          type: boolean
          description: Saklar denda kondisi; wajib disertai minimal satu nominal lebih dari 0.
        damageFeeMinorAmount:
          type: integer
          minimum: 0
          description: Nominal denda kondisi ringan dalam IDR rupiah utuh.
        damageFeeModerateAmount:
          type: integer
          minimum: 0
          description: Nominal denda kondisi sedang dalam IDR rupiah utuh.
        damageFeeSevereAmount:
          type: integer
          minimum: 0
          description: Nominal denda kondisi parah dalam IDR rupiah utuh.
        damageFeeMaxAmount:
          type: [ integer, 'null' ]
          minimum: 1
          description: Plafon total usulan denda kondisi; null menghapus plafon.
        damagePenaltyOrderMaxAmount:
          type: [ integer, 'null' ]
          minimum: 1
          description: Batas total denda aktif per order; null menghapus batas.

    InviteMemberRequest:
      type: object
      required: [ email, role ]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ MANAGER, STAFF, CASHIER ]
        permissions:
          type: array
          items:
            type: string

    UpdateMemberRequest:
      type: object
      properties:
        role:
          type: string
          enum: [ MANAGER, STAFF, CASHIER ]
        permissions:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ ACTIVE, REVOKED ]

    MemberResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Email akun member agar operator bisa mengenali staf tanpa membuka userId.
        ownerName:
          type: string
          nullable: true
        role:
          type: string
          enum: [ OWNER, MANAGER, STAFF, CASHIER ]
        status:
          type: string
          enum: [ INVITED, ACTIVE, REVOKED ]
        permissions:
          type: array
          items:
            type: string
        activatedAt:
          type: string
          format: date-time
          nullable: true

    # --- Catalog ---
    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateCategoryRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          maxLength: 100

    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        stockMode:
          type: string
          enum: [ QUANTITY, INDIVIDUAL_UNITS ]
        capacity:
          type: integer
          minimum: 0
        isActive:
          type: boolean
        rate:
          $ref: '#/components/schemas/RateResponse'
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        categoryId:
          type: string
          format: uuid
        stockMode:
          type: string
          enum: [ QUANTITY, INDIVIDUAL_UNITS ]
          default: QUANTITY
        capacity:
          type: integer
          minimum: 0
          default: 0
        isActive:
          type: boolean
          default: true

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        categoryId:
          type: string
          format: uuid
          nullable: true
        capacity:
          type: integer
          minimum: 0
        isActive:
          type: boolean

    RateResponse:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        perDayAmount:
          type: string
          description: IDR rupiah utuh (BigInt sebagai string)
          example: "150000"
        perWeekAmount:
          type: string
          nullable: true
          example: "900000"
        perMonthAmount:
          type: string
          nullable: true
          example: "3500000"
        updatedAt:
          type: string
          format: date-time

    UpsertRateRequest:
      type: object
      required: [ perDayAmount ]
      properties:
        perDayAmount:
          type: integer
          minimum: 1
          description: IDR rupiah utuh
        perWeekAmount:
          type: integer
          minimum: 1
          nullable: true
        perMonthAmount:
          type: integer
          minimum: 1
          nullable: true

    AssetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
          enum: [ AVAILABLE, RESERVED, MAINTENANCE, DAMAGED, RETIRED ]
        conditionNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAssetRequest:
      type: object
      required: [ code ]
      properties:
        code:
          type: string
          maxLength: 100
          description: Kode unik unit fisik per tenant (mis. nomor seri)
        status:
          type: string
          enum: [ AVAILABLE, RESERVED, MAINTENANCE, DAMAGED, RETIRED ]
          default: AVAILABLE
        conditionNote:
          type: string
          maxLength: 500

    UpdateAssetRequest:
      type: object
      properties:
        status:
          type: string
          enum: [ AVAILABLE, RESERVED, MAINTENANCE, DAMAGED, RETIRED ]
        conditionNote:
          type: string
          maxLength: 500
          nullable: true

    MaintenanceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateMaintenanceRequest:
      type: object
      required: [ startAt, endAt ]
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 500

    # --- Reservation & Availability (ADR-001 §1) ---
    ReservationItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        priceSnapshot:
          type: string
          description: Total harga periode (IDR rupiah utuh) dihitung server dari Rate
          example: "600000"
        currency:
          type: string
          example: IDR

    ReservationAllocationResponse:
      type: object
      description: |
        Alokasi stok per produk/periode. Dua alokasi `ACTIVE` pada unit fisik
        yang sama tidak boleh tumpang tindih (exclusion constraint PostgreSQL).
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          nullable: true
          description: Unit fisik konkret (null untuk stok kuantitas)
        quantity:
          type: integer
          minimum: 1
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ ACTIVE, RELEASED ]
        releasedAt:
          type: string
          format: date-time
          nullable: true

    ReservationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ PENDING_APPROVAL, CONFIRMED, REJECTED, CANCELLED, EXPIRED, CONVERTED_TO_ORDER ]
        bookingMode:
          type: string
          enum: [ MANUAL, AUTOMATIC ]
        customerId:
          type: string
          format: uuid
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
        hasOpenConflict:
          type: boolean
          description: >-
            Flag operasional: reservasi terdampak override konflik perpanjangan Opsi B. Lifecycle reservasi tidak diubah otomatis.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationItemResponse'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/ReservationAllocationResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateReservationItemRequest:
      type: object
      required: [ productId, quantity ]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    CreateReservationRequest:
      type: object
      required: [ startAt, endAt, items ]
      properties:
        startAt:
          type: string
          format: date-time
          description: Awal periode sewa (ISO 8601)
        endAt:
          type: string
          format: date-time
          description: Akhir periode sewa (eksklusif, rentang half-open)
        customerId:
          type: string
          format: uuid
          description: Pelanggan dalam tenant yang sama (opsional)
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CreateReservationItemRequest'

    ConfirmReservationRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500

    RejectReservationRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    CancelReservationRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    AvailabilityResponse:
      type: object
      description: Snapshot ketersediaan read-only untuk satu produk pada satu periode.
      properties:
        productId:
          type: string
          format: uuid
        stockMode:
          type: string
          enum: [ QUANTITY, INDIVIDUAL_UNITS ]
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 0
        allocated:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        maintenanceBlocked:
          type: integer
          minimum: 0
        availableAssetIds:
          type: array
          description: Unit fisik yang bebas pada periode ini (kosong untuk stok kuantitas)
          items:
            type: string
            format: uuid

    HealthResponse:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ ok ]

    ReadinessResponse:
      type: object
      required: [ status, database ]
      properties:
        status:
          type: string
          enum: [ ok, degraded ]
        database:
          type: string
          enum: [ ok, unavailable ]

    # --- Return & Inspection ---
    ReturnItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        assetId:
          type: [ string, 'null' ]
          format: uuid
        quantity:
          type: integer
          minimum: 1
        conditionNote:
          type: [ string, 'null' ]

    ReturnItemInput:
      type: object
      required: [ productId, quantity ]
      properties:
        productId:
          type: string
          format: uuid
        assetId:
          type: [ string, 'null' ]
          format: uuid
          description: Wajib untuk produk INDIVIDUAL_UNITS; quantity harus 1
        quantity:
          type: integer
          minimum: 1
        conditionNote:
          type: string
          maxLength: 500

    CreateReturnRequest:
      type: object
      required: [ items ]
      properties:
        notes:
          type: string
          maxLength: 2000
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReturnItemInput'

    CompleteReturnRequest:
      type: object
      properties:
        receivedAt:
          type: string
          format: date-time
          description: Waktu aktual barang diterima; default waktu server
        notes:
          type: string
          maxLength: 2000

    CancelReturnRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    ReturnRecordResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ PENDING, COMPLETED, CANCELLED ]
        returnedAt:
          type: [ string, 'null' ]
          format: date-time
        receivedByUserId:
          type: [ string, 'null' ]
          format: uuid
        notes:
          type: [ string, 'null' ]
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReturnItemResponse'
        lateFee:
          $ref: '#/components/schemas/LateFeeResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LateFeeResponse:
      type: object
      description: >-
        Denda keterlambatan yang dihitung server dari `returnedAt` terhadap `endAt`
        order. Nilainya usulan untuk inspeksi, bukan tambahan tagihan otomatis.
      properties:
        enabled:
          type: boolean
        unit:
          type: string
          enum: [ DAY, HOUR ]
        rateAmount:
          type: string
          description: Tarif per satuan, IDR rupiah utuh.
        dueAt:
          type: [ string, 'null' ]
          format: date-time
        returnedAt:
          type: [ string, 'null' ]
          format: date-time
        overdueMs:
          type: integer
          description: Selisih milidetik antara waktu terima dan batas waktu (0 bila tidak telat).
        units:
          type: integer
          description: Jumlah satuan keterlambatan (dibulatkan ke atas).
        amount:
          type: string
          description: Total denda, IDR rupiah utuh.

    DamageFeeResponse:
      type: object
      description: >-
        Usulan denda kerusakan yang dihitung server dari snapshot konfigurasi
        tenant saat inspeksi dibuat. Bukan tagihan otomatis dan bukan keputusan
        final; `penaltyAmount` tetap diisi petugas berizin.
      properties:
        enabled:
          type: boolean
        severity:
          type: [ string, 'null' ]
          enum: [ MINOR, MODERATE, SEVERE, null ]
        label:
          type: [ string, 'null' ]
          description: Label tingkat kondisi dalam bahasa Indonesia.
        amount:
          type: [ string, 'null' ]
          description: Usulan denda setelah plafon; null bila tidak ada usulan.
        rawAmount:
          type: [ string, 'null' ]
          description: Usulan sebelum plafon.
        capped:
          type: boolean
          description: True bila usulan dipotong plafon tenant.
        maxAmount:
          type: [ string, 'null' ]
          description: Plafon yang berlaku pada snapshot inspeksi.
        amounts:
          type: object
          description: Snapshot nominal per tingkat kondisi, IDR rupiah utuh.
          properties:
            MINOR:
              type: string
            MODERATE:
              type: string
            SEVERE:
              type: string

    CreateInspectionAttachmentRequest:
      type: object
      required: [ objectKey ]
      properties:
        objectKey: { type: string, maxLength: 500 }
        mimeType: { type: string, default: image/jpeg }
        altText: { type: string, maxLength: 300 }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        fileSizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Ukuran objek hasil upload; server menolak di atas 10 MB.

    InspectionItemInput:
      type: object
      required: [ productId, severity ]
      properties:
        productId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, default: 1 }
        severity:
          type: string
          enum: [ MINOR, MODERATE, SEVERE ]
        note: { type: string, maxLength: 500 }

    InspectionItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        assetId:
          type: [ string, 'null' ]
          format: uuid
        quantity: { type: integer }
        severity:
          type: string
          enum: [ MINOR, MODERATE, SEVERE ]
        severityLabel:
          type: string
          description: Label tampilan tingkat kerusakan.
        note:
          type: [ string, 'null' ]
        suggestedAmount:
          type: [ string, 'null' ]
          description: Usulan baris ini, IDR rupiah utuh (dari snapshot).

    InspectionWhatsAppMessageResponse:
      type: object
      required: [ text, inspectionStatus ]
      properties:
        text:
          type: string
          description: Pesan siap kirim (baris baru dengan \n).
        phone:
          type: [ string, 'null' ]
          description: Nomor pelanggan bila tersimpan.
        customerName: { type: [ string, 'null' ] }
        orderNumber: { type: [ string, 'null' ] }
        inspectionStatus:
          type: string
          enum: [ SUBMITTED, APPROVED, REJECTED ]
        totalAmount:
          type: [ string, 'null' ]
          description: Denda/ usulan yang disebut di pesan, IDR rupiah utuh.

    OrderPenaltyResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        inspectionId: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string, enum: [ IDR ] }
        reason: { type: string }
        status:
          type: string
          enum: [ RECORDED, VOIDED ]
          description: VOIDED tidak dihitung dalam penaltyTotalAmount/amountDue.
        voidedAt:
          type: [ string, 'null' ]
          format: date-time
        voidedReason:
          type: [ string, 'null' ]
        createdByUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    RequestStorageUploadUrl:
      type: object
      required: [ category, filename, contentType ]
      properties:
        category:
          type: string
          enum: [ branding, products, receipts, inspections, general ]
        filename: { type: string, maxLength: 255 }
        contentType: { type: string, maxLength: 100 }

    StorageUploadUrlResponse:
      type: object
      properties:
        uploadUrl: { type: string }
        objectKey: { type: string }
        publicUrl: { type: string }

    StorageDownloadUrlResponse:
      type: object
      properties:
        objectKey: { type: string }
        downloadUrl: { type: string }
        expiresInSeconds: { type: integer }

    VoidOrderPenaltyRequest:
      type: object
      required: [ reason ]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    CreateOrderPenaltyRequest:
      type: object
      required: [ inspectionId, reason ]
      properties:
        inspectionId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }

    DamageFeeRevisionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        inspectionEnabled: { type: boolean }
        feeEnabled: { type: boolean }
        minorAmount: { type: string }
        moderateAmount: { type: string }
        severeAmount: { type: string }
        maxAmount:
          type: [ string, 'null' ]
        actorUserId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    DamageFeeCategoryAmountResponse:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        minorAmount: { type: string }
        moderateAmount: { type: string }
        severeAmount: { type: string }

    UpsertDamageFeeCategoryRequest:
      type: object
      required: [ categoryId ]
      properties:
        categoryId: { type: string, format: uuid }
        minorAmount: { type: integer, minimum: 0 }
        moderateAmount: { type: integer, minimum: 0 }
        severeAmount: { type: integer, minimum: 0 }

    ReceivableAgingResponse:
      type: object
      properties:
        asOf: { type: string, format: date-time }
        thresholds:
          type: object
          properties:
            invoiceDays: { type: integer }
            penaltyDays: { type: integer }
        outstanding:
          type: object
          properties:
            orders: { type: integer }
            amount: { type: string }
            overdueOrders: { type: integer }
            overdueAmount: { type: string }
            oldestDays: { type: integer }
        penalties:
          type: object
          properties:
            orders: { type: integer }
            amount: { type: string }
            agedOrders: { type: integer }
            agedAmount: { type: string }
            oldestDays: { type: integer }
        buckets:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [ '0-7', '8-14', '15-30', '31+' ] }
              orders: { type: integer }
              amount: { type: string }
        alertCount:
          type: integer
          description: Pesanan dengan tagihan atau denda yang sudah menua.

    DamageFeeReportResponse:
      type: object
      properties:
        range:
          type: object
          properties:
            from: { type: [ string, 'null' ], format: date-time }
            to: { type: [ string, 'null' ], format: date-time }
        penalties:
          type: object
          description: Hanya denda berstatus RECORDED yang masuk count/totalAmount.
          properties:
            count: { type: integer }
            totalAmount: { type: string }
            voidedCount:
              type: integer
              description: Jumlah denda yang dibatalkan pada rentang yang sama.
        inspections:
          type: object
          properties:
            DRAFT: { type: integer }
            SUBMITTED: { type: integer }
            APPROVED: { type: integer }
            REJECTED: { type: integer }
            DISPUTED: { type: integer }
        severity:
          type: object
          properties:
            MINOR: { $ref: '#/components/schemas/DamageSeverityStat' }
            MODERATE: { $ref: '#/components/schemas/DamageSeverityStat' }
            SEVERE: { $ref: '#/components/schemas/DamageSeverityStat' }
        topProducts:
          type: array
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              productName:
                type: [ string, 'null' ]
                description: Nama produk saat laporan dibaca; null bila produk sudah dihapus.
              lines: { type: integer }
              quantity: { type: integer }
              suggestedAmount: { type: string }

    DamageSeverityStat:
      type: object
      properties:
        lines: { type: integer }
        quantity: { type: integer }
        suggestedAmount: { type: string }

    ReturnRecordDetail:
      allOf:
        - $ref: '#/components/schemas/ReturnRecordResponse'
        - type: object
          properties:
            inspections:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [ DRAFT, SUBMITTED, APPROVED, REJECTED ]
                  createdAt:
                    type: string
                    format: date-time

    CreateInspectionRequest:
      type: object
      properties:
        returnRecordId:
          type: [ string, 'null' ]
          format: uuid
        summary:
          type: string
          maxLength: 2000
        severity:
          type: string
          enum: [ MINOR, MODERATE, SEVERE ]
          description: >-
            Tingkat kerusakan (ringan/sedang/parah). Menentukan usulan denda
            otomatis dari snapshot konfigurasi tenant; bukan keputusan final.
        items:
          type: array
          description: >-
            Rincian kerusakan per item/unit. Bila diisi, usulan dijumlahkan dari
            baris-baris ini (menggantikan `severity` level inspeksi).
          items:
            $ref: '#/components/schemas/InspectionItemInput'

    SubmitInspectionRequest:
      type: object
      properties:
        summary:
          type: string
          maxLength: 2000
        penaltyAmount:
          type: integer
          minimum: 0
          description: Usulan denda, IDR rupiah utuh
        severity:
          type: string
          enum: [ MINOR, MODERATE, SEVERE ]
          description: Tingkat kerusakan; mengubah usulan denda otomatis dari snapshot inspeksi.
        items:
          type: array
          description: Rincian kerusakan pengganti (hanya saat status DRAFT).
          items:
            $ref: '#/components/schemas/InspectionItemInput'

    DecideInspectionRequest:
      type: object
      required: [ decision ]
      properties:
        decision:
          type: string
          enum: [ APPROVE, REJECT ]
        penaltyAmount:
          type: integer
          minimum: 0
          description: Wajib bila decision=APPROVE; IDR rupiah utuh
        summary:
          type: string
          maxLength: 2000

    InspectionAttachmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        objectKey:
          type: string
          description: Kunci objek di bucket Cloudflare R2
        mimeType:
          type: string
        fileSizeBytes:
          type: [ integer, 'null' ]
        altText:
          type: [ string, 'null' ]
        sortOrder:
          type: integer
        uploadedAt:
          type: string
          format: date-time

    InspectionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        returnRecordId:
          type: [ string, 'null' ]
          format: uuid
        status:
          type: string
          enum: [ DRAFT, SUBMITTED, APPROVED, REJECTED, DISPUTED ]
          description: DISPUTED = penyewa menyanggah; denda belum bisa ditagihkan.
        inspectedByUserId:
          type: [ string, 'null' ]
          format: uuid
        approvedByUserId:
          type: [ string, 'null' ]
          format: uuid
        summary:
          type: [ string, 'null' ]
        penaltyAmount:
          type: [ string, 'null' ]
          description: IDR rupiah utuh (BigInt sebagai string); null jika belum diputuskan
        disputeReason:
          type: [ string, 'null' ]
          description: Alasan sanggahan penyewa dari portal.
        disputedAt:
          type: [ string, 'null' ]
          format: date-time
        disputeResolution:
          type: [ string, 'null' ]
          enum: [ UPHELD, REVISED, null ]
          description: Hasil keputusan ulang terakhir; null selama sengketa berjalan.
        disputeResolvedAt:
          type: [ string, 'null' ]
          format: date-time
        severity:
          type: [ string, 'null' ]
          enum: [ MINOR, MODERATE, SEVERE, null ]
          description: Tingkat kerusakan yang dilaporkan petugas.
        suggestedPenaltyAmount:
          type: [ string, 'null' ]
          description: >-
            Usulan denda otomatis dari snapshot konfigurasi tenant saat inspeksi
            dibuat; null bila saklar denda mati atau tingkat kondisi kosong.
        damageFee:
          $ref: '#/components/schemas/DamageFeeResponse'
        items:
          type: array
          description: Rincian kerusakan per item/unit.
          items:
            $ref: '#/components/schemas/InspectionItemResponse'
        suggestedTotal:
          type: object
          description: >-
            Usulan gabungan yang dihitung server (denda kondisi dari snapshot +
            denda keterlambatan pengembalian). Klien tidak menjumlahkan sendiri.
          properties:
            damageFee: { type: string }
            lateFee: { type: string }
            total: { type: string }
        currency:
          type: string
          default: IDR
        inspectedAt:
          type: [ string, 'null' ]
          format: date-time
        submittedAt:
          type: [ string, 'null' ]
          format: date-time
        decidedAt:
          type: [ string, 'null' ]
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/InspectionAttachmentResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # --------------------------------------------------------
    # Order, payment manual, deposit ledger (migration 010)
    # --------------------------------------------------------
    OrderItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        assetId:
          type: [ string, 'null' ]
          format: uuid
        quantity: { type: integer, minimum: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        priceSnapshot:
          type: string
          description: IDR rupiah utuh per unit (BigInt sebagai string)
        currency: { type: string, default: IDR }

    PaymentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount:
          type: string
          description: IDR rupiah utuh (BigInt sebagai string)
        currency: { type: string, enum: [ IDR ] }
        method: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        context:
          type: string
          enum: [ NEW_BOOKING, ADD_UNIT, EXTENSION ]
          description: Snapshot konteks transaksi saat pembayaran dicatat.
        status: { type: string, enum: [ RECORDED, VOIDED ] }
        reference: { type: [ string, 'null' ] }
        voidReason: { type: [ string, 'null' ] }
        voidedByUserId:
          type: [ string, 'null' ]
          format: uuid
        voidedAt:
          type: [ string, 'null' ]
          format: date-time
        recordedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        orderTotals:
          type: object
          description: Hanya pada respons command payment/void.
          properties:
            totalAmount: { type: string }
            paidAmount: { type: string }
            outstandingAmount:
              type: string
              description: Boleh negatif bila pembayaran melebihi total (kelebihan bayar).
        whatsappMessage:
          description: >-
            Hanya pada respons pencatatan payment. Memakai template aktif untuk konteks+metode pembayaran (konfirmasi diutamakan, instruksi sebagai fallback); null bila tidak ada template aktif.
          oneOf:
            - $ref: '#/components/schemas/WhatsAppMessageResponse'
            - type: 'null'

    DepositMovementResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [ RECEIPT, DEDUCTION, REFUND, REVERSAL ] }
        amount: { type: string }
        currency: { type: string, enum: [ IDR ] }
        reason: { type: [ string, 'null' ] }
        method:
          type: [ string, 'null' ]
          enum: [ CASH, BANK_TRANSFER, QRIS, null ]
        reference: { type: [ string, 'null' ] }
        reversesId:
          type: [ string, 'null' ]
          format: uuid
        actorUserId:
          type: [ string, 'null' ]
          format: uuid
        createdAt: { type: string, format: date-time }

    DepositDeductionRequestResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        depositId: { type: string, format: uuid }
        amount: { type: string }
        currency: { type: string, enum: [ IDR ] }
        status: { type: string, enum: [ PENDING, APPROVED, REJECTED ] }
        reason: { type: string }
        conditionNotes: { type: [ string, 'null' ] }
        requestedByUserId: { type: string, format: uuid }
        approvedByUserId:
          type: [ string, 'null' ]
          format: uuid
        decisionReason: { type: [ string, 'null' ] }
        decidedAt:
          type: [ string, 'null' ]
          format: date-time
        movementId:
          type: [ string, 'null' ]
          format: uuid
        depositBalance:
          type: string
          description: Saldo deposit setelah keputusan (atau saat ini bila PENDING).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DepositResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        currency: { type: string, enum: [ IDR ] }
        balance:
          type: string
          description: Saldo dihitung dari ledger, tidak pernah negatif.
        movements:
          type: array
          items: { $ref: '#/components/schemas/DepositMovementResponse' }
        deductionRequests:
          type: array
          items: { $ref: '#/components/schemas/DepositDeductionRequestResponse' }
        createdAt: { type: string, format: date-time }

    CollateralResponse:
      type: object
      description: >-
        Jaminan non-uang pada order. Jaminan utama adalah ID card (tipe ID_CARD, maksimal satu HELD); jaminan lain (OTHER) opsional. Jaminan uang tetap memakai ledger deposit — tidak direpresentasikan di sini.
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        type: { type: string, enum: [ ID_CARD, OTHER ] }
        status: { type: string, enum: [ HELD, RETURNED ] }
        label:
          type: string
          description: Nama/jenis jaminan (default "KTP" untuk ID_CARD bila kosong).
        documentNumber: { type: [ string, 'null' ] }
        description: { type: [ string, 'null' ] }
        notes: { type: [ string, 'null' ] }
        heldAt: { type: string, format: date-time }
        returnedAt: { type: [ string, 'null' ], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber:
          type: string
          description: Immutable, unik per tenant.
        status:
          type: string
          enum: [ CONFIRMED, READY_FOR_HANDOVER, ACTIVE, RETURN_IN_PROGRESS, COMPLETED, CANCELLED ]
        currency: { type: string, enum: [ IDR ] }
        totalAmount: { type: string }
        paidAmount: { type: string }
        outstandingAmount: { type: string }
        penaltyTotalAmount:
          type: string
          description: >-
            Total denda kerusakan yang sudah dicatat sebagai tagihan order.
            `totalAmount` tetap nilai sewa; denda tidak mengubahnya.
        amountDue:
          type: string
          description: totalAmount + penaltyTotalAmount − paidAmount.
        penalties:
          type: array
          items:
            $ref: '#/components/schemas/OrderPenaltyResponse'
        sourceReservationId:
          type: [ string, 'null' ]
          format: uuid
        customerId:
          type: [ string, 'null' ]
          format: uuid
        hasOpenConflict:
          type: boolean
          description: >-
            True bila order ini terdampak konflik perpanjangan Opsi B yang belum diselesaikan. Status lifecycle tidak berubah otomatis.
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemResponse' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/PaymentResponse' }
        deposit:
          oneOf:
            - $ref: '#/components/schemas/DepositResponse'
            - type: 'null'
        collaterals:
          type: array
          description: >-
            Jaminan non-uang (ID card utama + jaminan lain opsional). Jaminan uang tidak muncul di sini — saldo deposit memakai field `deposit`.
          items: { $ref: '#/components/schemas/CollateralResponse' }
        whatsappMessages:
          type: array
          description: >-
            Riwayat snapshot pesan WhatsApp, terbaru lebih dulu. Pada respons konversi/booking berisi satu pesan per metode pembayaran aktif yang punya template aktif pada konteks NEW_BOOKING; pada detail order berisi seluruh snapshot yang pernah disajikan (termasuk per payment).
          items: { $ref: '#/components/schemas/WhatsAppMessageResponse' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExtensionConflictSummary:
      type: object
      description: >-
        Ringkasan booking/alokasi terdampak yang dihitung server. Client tidak boleh mengirim daftar ini sebagai sumber kebenaran.
      required: [ allocationId, productId, startAt, endAt, quantity, reason ]
      properties:
        allocationId: { type: string, format: uuid }
        reservationId:
          type: [ string, 'null' ]
          format: uuid
        orderId:
          type: [ string, 'null' ]
          format: uuid
        orderNumber:
          type: [ string, 'null' ]
        customerName:
          type: [ string, 'null' ]
        productId: { type: string, format: uuid }
        productName: { type: string }
        assetId:
          type: [ string, 'null' ]
          format: uuid
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        quantity: { type: integer, minimum: 1 }
        reason:
          type: string
          enum: [ ASSET_OVERLAP, CAPACITY_EXCEEDED ]

    ExtensionOverrideResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        policy: { type: string, enum: [ CHECK_AVAILABILITY, SKIP_AVAILABILITY ] }
        reason: { type: string }
        riskAcknowledgedAt: { type: string, format: date-time }
        actorUserId:
          type: [ string, 'null' ]
          format: uuid
        previousEndAt: { type: string, format: date-time }
        requestedEndAt: { type: string, format: date-time }
        amountSnapshot: { type: string }
        currency: { type: string, enum: [ IDR ] }
        conflictCount: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }

    ExtensionConflictTaskResponse:
      type: object
      description: >-
        Relasi konflik sekaligus tugas operasional penyelesaian. OPEN berarti masih harus ditindaklanjuti; tidak mengubah lifecycle order/booking.
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ OPEN, RESOLVED ] }
        conflictingAllocationId: { type: string, format: uuid }
        conflictingReservationId:
          type: [ string, 'null' ]
          format: uuid
        conflictingOrderId:
          type: [ string, 'null' ]
          format: uuid
        summary:
          oneOf:
            - $ref: '#/components/schemas/ExtensionConflictSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderExtensionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [ PENDING_APPROVAL, APPROVED, REJECTED ] }
        previousEndAt: { type: string, format: date-time }
        requestedEndAt: { type: string, format: date-time }
        amount:
          type: string
          description: Biaya perpanjangan dihitung server (IDR utuh).
        currency: { type: string, enum: [ IDR ] }
        requestedByUserId:
          type: [ string, 'null' ]
          format: uuid
        decidedByUserId:
          type: [ string, 'null' ]
          format: uuid
        decidedAt:
          type: [ string, 'null' ]
          format: date-time
        decisionReason:
          type: [ string, 'null' ]
        override:
          oneOf:
            - $ref: '#/components/schemas/ExtensionOverrideResponse'
            - type: 'null'
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/ExtensionConflictTaskResponse' }
        operationalTasks:
          type: array
          description: >-
            Hanya pada respons command override; daftar tugas OPEN yang dibuat dalam transaksi yang sama.
          items: { $ref: '#/components/schemas/ExtensionConflictTaskResponse' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TenantExtensionRequest:
      allOf:
        - $ref: '#/components/schemas/OrderExtensionResponse'
        - type: object
          description: >-
            Baris antrean permintaan perpanjangan lintas order: body perpanjangan plus konteks order agar operator mengenali pesanan tanpa membukanya.
          properties:
            order:
              type: object
              properties:
                orderNumber: { type: string }
                status:
                  type: string
                  enum: [ CONFIRMED, READY_FOR_HANDOVER, ACTIVE, RETURN_IN_PROGRESS, COMPLETED, CANCELLED ]
                customerName: { type: [ string, 'null' ] }

    RequestExtensionRequest:
      type: object
      required: [ requestedEndAt ]
      properties:
        requestedEndAt:
          type: string
          format: date-time
          description: Harus setelah tanggal akhir sewa saat ini.
        note: { type: string, maxLength: 500 }

    ApproveExtensionRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }

    RejectExtensionRequest:
      type: object
      required: [ reason ]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    OverrideExtensionConflictRequest:
      type: object
      required: [ reason, riskConfirmed ]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
        riskConfirmed:
          type: boolean
          enum: [ true ]
          description: >-
            Konfirmasi risiko eksplisit. Nilai false ditolak 422 BUSINESS_RULE_VIOLATION tanpa mengubah order/alokasi.

    ResolveExtensionConflictRequest:
      type: object
      required: [ resolutionNote ]
      properties:
        resolutionNote:
          type: string
          minLength: 3
          maxLength: 500
          description: >-
            Catatan penyelesaian tugas operasional (mis. unit pengganti sudah disiapkan). Tersimpan di konflik dan audit.

    ExtensionConflictOverviewConflict:
      type: object
      description: >-
        Detail konflik untuk ringkasan operasional. `summary` adalah snapshot server saat override disetujui; `resolved*` terisi setelah command resolve.
      properties:
        id: { type: string, format: uuid }
        extensionId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [ OPEN, RESOLVED ] }
        conflictingAllocationId: { type: string, format: uuid }
        conflictingReservationId:
          type: [ string, 'null' ]
          format: uuid
        conflictingOrderId:
          type: [ string, 'null' ]
          format: uuid
        summary:
          oneOf:
            - $ref: '#/components/schemas/ExtensionConflictSummary'
            - type: 'null'
        resolvedAt:
          type: [ string, 'null' ]
          format: date-time
        resolvedByUserId:
          type: [ string, 'null' ]
          format: uuid
        resolutionNote:
          type: [ string, 'null' ]
        extension:
          oneOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                orderId: { type: string, format: uuid }
                status:
                  type: string
                  enum: [ PENDING_APPROVAL, APPROVED, REJECTED ]
                previousEndAt: { type: string, format: date-time }
                requestedEndAt: { type: string, format: date-time }
                overrideReason:
                  type: [ string, 'null' ]
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExtensionConflictOverview:
      type: object
      description: >-
        Ringkasan operasional order & reservasi ber-flag konflik. Satu konflik dapat muncul pada kedua order yang bertabrakan (order perpanjangan dan order terdampak) agar setiap entri lengkap; deduplikasi dilakukan konsumen bila perlu.
      properties:
        generatedAt: { type: string, format: date-time }
        filter: { type: string, enum: [ OPEN, RESOLVED, ALL ] }
        summary:
          type: object
          properties:
            openConflicts: { type: integer, minimum: 0 }
            resolvedConflicts: { type: integer, minimum: 0 }
            flaggedOrders: { type: integer, minimum: 0 }
            flaggedReservations: { type: integer, minimum: 0 }
        orders:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              orderNumber: { type: string }
              status:
                type: string
                enum: [ CONFIRMED, READY_FOR_HANDOVER, ACTIVE, RETURN_IN_PROGRESS, COMPLETED, CANCELLED ]
              customerName:
                type: [ string, 'null' ]
              currency: { type: string, enum: [ IDR ] }
              totalAmount: { type: string }
              hasOpenConflict: { type: boolean }
              openConflictCount: { type: integer, minimum: 0 }
              conflicts:
                type: array
                items: { $ref: '#/components/schemas/ExtensionConflictOverviewConflict' }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
        reservations:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              status:
                type: string
                enum: [ PENDING_APPROVAL, CONFIRMED, REJECTED, CANCELLED, EXPIRED, CONVERTED_TO_ORDER ]
              customerName:
                type: [ string, 'null' ]
              startAt: { type: string, format: date-time }
              endAt: { type: string, format: date-time }
              hasOpenConflict: { type: boolean }
              openConflictCount: { type: integer, minimum: 0 }
              conflicts:
                type: array
                items: { $ref: '#/components/schemas/ExtensionConflictOverviewConflict' }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }

    ResolveExtensionConflictResponse:
      type: object
      properties:
        conflict: { $ref: '#/components/schemas/ExtensionConflictOverviewConflict' }
        hasOpenConflict:
          type: object
          properties:
            orders:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  hasOpenConflict: { type: boolean }
                  openConflicts: { type: integer, minimum: 0 }
            reservation:
              oneOf:
                - type: object
                  properties:
                    id: { type: string, format: uuid }
                    hasOpenConflict: { type: boolean }
                    openConflicts: { type: integer, minimum: 0 }
                - type: 'null'
        openConflictsRemaining: { type: integer, minimum: 0 }
        alreadyResolved: { type: boolean }

    CreateOrderRequest:
      type: object
      required: [ reservationId ]
      properties:
        reservationId:
          type: string
          format: uuid
          description: Reservasi CONFIRMED pada tenant yang sama.

    ReadyForHandoverRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }

    HandoverRequest:
      type: object
      properties:
        handoverAt:
          type: string
          format: date-time
          description: Default waktu server; tidak boleh di masa depan.
        conditionNotes: { type: string, maxLength: 1000 }
        evidenceRefs:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 200 }

    CompleteOrderRequest:
      type: object
      properties:
        settlementNote: { type: string, maxLength: 1000 }

    RecordPaymentRequest:
      type: object
      required: [ amount, currency, method ]
      properties:
        amount:
          type: string
          pattern: '^[1-9][0-9]{0,15}$'
          description: Integer rupiah utuh > 0 (bukan float).
        currency: { type: string, enum: [ IDR ] }
        method: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        context:
          type: string
          enum: [ NEW_BOOKING, ADD_UNIT, EXTENSION ]
          default: NEW_BOOKING
          description: >-
            Konteks transaksi; backend menolak metode yang nonaktif untuk konteks ini (422 PAYMENT_METHOD_DISABLED).
        receivedAt:
          type: string
          format: date-time
          description: Default waktu server; tidak boleh di masa depan.
        reference: { type: string, maxLength: 200 }

    PaymentMethodSettingResponse:
      type: object
      properties:
        context: { type: string, enum: [ NEW_BOOKING, ADD_UNIT, EXTENSION ] }
        method: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        enabled:
          type: boolean
          description: Baris yang belum pernah disimpan ditampilkan aktif (default).
        updatedByUserId:
          type: [ string, 'null' ]
          format: uuid
        updatedAt:
          type: [ string, 'null' ]
          format: date-time

    PaymentMethodsResponse:
      type: object
      required: [ settings ]
      properties:
        settings:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: '#/components/schemas/PaymentMethodSettingResponse' }

    PaymentMethodSettingInput:
      type: object
      required: [ context, method, enabled ]
      additionalProperties: false
      properties:
        context: { type: string, enum: [ NEW_BOOKING, ADD_UNIT, EXTENSION ] }
        method: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        enabled: { type: boolean }

    UpdatePaymentMethodsRequest:
      type: object
      required: [ settings ]
      properties:
        settings:
          type: array
          minItems: 1
          maxItems: 9
          description: >-
            Parsial: entri yang tidak dikirim memakai nilai efektif saat ini. Setiap konteks wajib menyisakan minimal satu metode aktif.
          items: { $ref: '#/components/schemas/PaymentMethodSettingInput' }

    WhatsAppTemplateVersionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        bodySnapshot: { type: string }
        metadataSnapshot:
          type: [ object, 'null' ]
          additionalProperties: true
        actorId:
          type: [ string, 'null' ]
          format: uuid
        changeReason: { type: [ string, 'null' ] }
        createdAt: { type: string, format: date-time }

    WhatsAppTemplateResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        context: { type: string, enum: [ NEW_BOOKING, ADD_UNIT, EXTENSION ] }
        paymentMethod: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        purpose: { type: string, enum: [ PAYMENT_INSTRUCTION, PAYMENT_CONFIRMATION ] }
        name: { type: string, maxLength: 120 }
        body:
          type: string
          maxLength: 4000
          description: Teks click-to-chat; tidak dieksekusi sebagai HTML/JS.
        isActive: { type: boolean }
        isSystemDefault: { type: boolean }
        defaultTemplateKey: { type: string }
        currentVersion: { type: integer, minimum: 1 }
        createdByUserId:
          type: [ string, 'null' ]
          format: uuid
        updatedByUserId:
          type: [ string, 'null' ]
          format: uuid
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        versions:
          type: array
          description: Hanya pada respons detail; maksimal 20 versi terbaru.
          items: { $ref: '#/components/schemas/WhatsAppTemplateVersionResponse' }

    CreateWhatsAppTemplateRequest:
      type: object
      required: [ context, paymentMethod, purpose, name, body ]
      additionalProperties: false
      properties:
        context: { type: string, enum: [ NEW_BOOKING, ADD_UNIT, EXTENSION ] }
        paymentMethod: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        purpose: { type: string, enum: [ PAYMENT_INSTRUCTION, PAYMENT_CONFIRMATION ] }
        name: { type: string, minLength: 1, maxLength: 120 }
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: >-
            Placeholder resmi: {{nama_bisnis}}, {{nama_penyewa}}, {{nomor_pesanan}}, {{daftar_barang}}, {{periode}}, {{nominal_tagihan}}, {{jenis_transaksi}}, {{waktu_pembayaran}}. Placeholder lain ditolak 400.
        isActive: { type: boolean, default: true }

    DuplicateWhatsAppTemplateRequest:
      type: object
      required: [ context, paymentMethod, purpose ]
      additionalProperties: false
      properties:
        context: { type: string, enum: [ NEW_BOOKING, ADD_UNIT, EXTENSION ] }
        paymentMethod: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        purpose: { type: string, enum: [ PAYMENT_INSTRUCTION, PAYMENT_CONFIRMATION ] }
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Nama salinan. Default `<nama sumber> (salinan)` (dipotong 120 karakter). Body disalin dari sumber tanpa diubah.
        isActive:
          type: boolean
          description: Status aktif salinan; default mengikuti template sumber.

    UpdateWhatsAppTemplateRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 4000 }
        isActive: { type: boolean }

    PreviewWhatsAppTemplateRequest:
      type: object
      required: [ body ]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        values:
          type: object
          additionalProperties: { type: string }
          description: Nilai override; placeholder yang tidak diisi memakai contoh.

    PreviewWhatsAppTemplateResponse:
      type: object
      properties:
        body: { type: string }
        placeholders:
          type: array
          items: { type: string }

    WhatsAppMessageResponse:
      type: object
      description: >-
        Snapshot immutable: body sudah dirender dan versi template yang dipakai tersimpan. Mengubah template setelahnya tidak mengubah snapshot ini.
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        paymentId:
          type: [ string, 'null' ]
          format: uuid
          description: Null untuk pesan booking sebelum ada pembayaran.
        templateId:
          type: [ string, 'null' ]
          format: uuid
        templateVersion:
          type: [ integer, 'null' ]
          minimum: 1
        context: { type: string, enum: [ NEW_BOOKING, ADD_UNIT, EXTENSION ] }
        paymentMethod: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        purpose: { type: string, enum: [ PAYMENT_INSTRUCTION, PAYMENT_CONFIRMATION ] }
        templateName: { type: [ string, 'null' ] }
        body:
          type: string
          description: Teks click-to-chat final; tidak dieksekusi sebagai HTML/JS.
        createdAt: { type: string, format: date-time }

    VoidPaymentRequest:
      type: object
      required: [ reason ]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    RefundResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        amount:
          type: string
          description: IDR rupiah utuh (BigInt sebagai string)
        currency: { type: string, enum: [ IDR ] }
        status:
          type: string
          enum: [ REQUESTED, APPROVED, PROCESSING, SUCCEEDED, FAILED, CANCELLED ]
        reason: { type: [ string, 'null' ] }
        reference: { type: [ string, 'null' ] }
        requestedByUserId:
          type: [ string, 'null' ]
          format: uuid
        approvedByUserId:
          type: [ string, 'null' ]
          format: uuid
        decisionReason: { type: [ string, 'null' ] }
        processedByUserId:
          type: [ string, 'null' ]
          format: uuid
        resultNote: { type: [ string, 'null' ] }
        requestedAt: { type: string, format: date-time }
        processedAt:
          type: [ string, 'null' ]
          format: date-time
        refundableAmount:
          type: string
          description: Sisa nilai payment yang belum tertahan refund aktif.
        refundedAmount:
          type: string
          description: Total refund SUCCEEDED untuk payment ini.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RequestRefundRequest:
      type: object
      required: [ paymentId, amount, currency, reason ]
      properties:
        paymentId:
          type: string
          format: uuid
          description: Payment RECORDED pada order yang sama.
        amount:
          type: string
          pattern: '^[1-9][0-9]{0,15}$'
          description: Integer rupiah utuh > 0; tidak boleh melebihi sisa refundable.
        currency: { type: string, enum: [ IDR ] }
        reason: { type: string, minLength: 3, maxLength: 500 }
        reference: { type: string, maxLength: 200 }

    RefundDecisionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    RefundResultRequest:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ SUCCEEDED, FAILED ]
          description: >-
            MVP offline: mencatat hasil tindakan staf, bukan status gateway.
        reference: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 500 }

    DepositReceiptRequest:
      type: object
      required: [ amount, currency ]
      properties:
        amount: { type: string, pattern: '^[1-9][0-9]{0,15}$' }
        currency: { type: string, enum: [ IDR ] }
        method: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        reference: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 500 }

    DepositDeductionRequest:
      type: object
      required: [ amount, currency, reason ]
      properties:
        amount: { type: string, pattern: '^[1-9][0-9]{0,15}$' }
        currency: { type: string, enum: [ IDR ] }
        reason: { type: string, minLength: 3, maxLength: 500 }
        conditionNotes: { type: string, maxLength: 1000 }
        inspectionId:
          type: string
          format: uuid
          description: >-
            Inspeksi sumber potongan. Bila diisi, nominal wajib sama dengan
            denda final inspeksi dan satu inspeksi hanya boleh memotong sekali.

    DepositDecisionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }

    DepositRefundRequest:
      type: object
      required: [ amount, currency, reason ]
      properties:
        amount: { type: string, pattern: '^[1-9][0-9]{0,15}$' }
        currency: { type: string, enum: [ IDR ] }
        reason: { type: string, minLength: 3, maxLength: 500 }
        reference: { type: string, maxLength: 200 }

    ReverseDepositMovementRequest:
      type: object
      required: [ reason ]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    CreateCollateralRequest:
      type: object
      required: [ type ]
      properties:
        type: { type: string, enum: [ ID_CARD, OTHER ] }
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Wajib untuk OTHER (nama barang/dokumen). Untuk ID_CARD default "KTP" bila kosong.
        documentNumber: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 500 }

    ReturnCollateralRequest:
      type: object
      properties:
        notes: { type: string, maxLength: 500 }

    # ----------------------------------------------------------
    # Alur penyewa publik (Notion 14)
    # ----------------------------------------------------------

    PublicTenantResponse:
      type: object
      description: >-
        Data tenant yang boleh terlihat penyewa. UUID tenant tidak pernah dikirim; slug adalah identitas publik.
      properties:
        slug: { type: string }
        name: { type: string }
        timezone: { type: string }
        currency: { type: string, enum: [ IDR ] }
        bookingMode: { type: string, enum: [ MANUAL, AUTOMATIC ] }
        catalogPolicy: { type: string, enum: [ CHECK_AVAILABILITY, SKIP_AVAILABILITY ] }
        whatsappNumber:
          type: string
          nullable: true
          description: Nomor click-to-chat; null berarti tenant belum mengaturnya.
        bankTransferInstructions:
          type: string
          nullable: true
        qrisImageUrl:
          type: string
          nullable: true
          format: uri

    PublicRateResponse:
      type: object
      properties:
        perDayAmount:
          type: string
          description: IDR rupiah utuh (BigInt sebagai string)
          example: "150000"
        perWeekAmount: { type: string, nullable: true }
        perMonthAmount: { type: string, nullable: true }

    PublicProductResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        stockMode: { type: string, enum: [ QUANTITY, INDIVIDUAL_UNITS ] }
        capacity: { type: integer, minimum: 0 }
        rate:
          $ref: '#/components/schemas/PublicRateResponse'
          nullable: true

    PublicCategoryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    PublicCatalogResponse:
      type: object
      properties:
        tenant:
          $ref: '#/components/schemas/PublicTenantResponse'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PublicCategoryResponse'
        products:
          type: array
          items:
            $ref: '#/components/schemas/PublicProductResponse'

    PublicProductDetailResponse:
      type: object
      properties:
        tenant:
          $ref: '#/components/schemas/PublicTenantResponse'
        product:
          $ref: '#/components/schemas/PublicProductResponse'

    PublicHostResponse:
      type: object
      description: >-
        Tenant yang memiliki hostname kustom ini. Hanya domain yang sudah diverifikasi dan aktif milik tenant ACTIVE yang dikembalikan; selain itu dijawab 404 netral. UUID tenant tidak pernah dikirim.
      properties:
        tenant:
          $ref: '#/components/schemas/PublicTenantResponse'

    PublicBookingGuest:
      type: object
      required: [ name ]
      description: >-
        Minimal satu dari `phone` atau `email` wajib diisi agar admin dapat menghubungi penyewa (ditegakkan server).
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        phone:
          type: string
          pattern: '^[+0-9][0-9\s().-]{6,24}$'
          nullable: true
        email: { type: string, format: email, maxLength: 254, nullable: true }

    PublicBookingTerms:
      type: object
      required: [ accepted, version ]
      properties:
        accepted:
          type: boolean
          const: true
          description: Wajib true; server menolak permintaan tanpa persetujuan.
        version:
          type: string
          minLength: 1
          maxLength: 40
          description: Versi syarat sewa yang disetujui, disimpan pada reservasi.

    PublicBookingItem:
      type: object
      required: [ productId, quantity ]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }

    CreatePublicBookingRequest:
      type: object
      required: [ startAt, endAt, items, guest, terms ]
      properties:
        startAt: { type: string, format: date-time }
        endAt:
          type: string
          format: date-time
          description: Akhir periode eksklusif.
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/PublicBookingItem'
        guest:
          $ref: '#/components/schemas/PublicBookingGuest'
        terms:
          $ref: '#/components/schemas/PublicBookingTerms'

    PublicBookingLine:
      type: object
      properties:
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        lineTotal:
          type: string
          description: IDR rupiah utuh untuk seluruh periode.

    PublicReservationSummary:
      type: object
      properties:
        reference: { type: string, format: uuid }
        status:
          type: string
          enum: [ PENDING_APPROVAL, CONFIRMED, REJECTED, CANCELLED, EXPIRED, CONVERTED_TO_ORDER ]
        bookingMode: { type: string, enum: [ MANUAL, AUTOMATIC ] }
        guestName: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicBookingLine'
        totalAmount:
          type: string
          description: IDR rupiah utuh, dihitung server dari tarif tersimpan.

    PublicPortalLink:
      type: object
      properties:
        token:
          type: string
          description: >-
            Token 256-bit. Hanya dikembalikan sekali pada respons booking; server menyimpan hash-nya. Tautan lama dicabut bila token baru diterbitkan.
        path: { type: string, example: /portal/AbCd... }
        expiresAt: { type: string, format: date-time }

    PublicBookingResponse:
      type: object
      properties:
        tenant:
          $ref: '#/components/schemas/PublicTenantResponse'
        reservation:
          $ref: '#/components/schemas/PublicReservationSummary'
        portal:
          $ref: '#/components/schemas/PublicPortalLink'

    PublicPaymentResponse:
      type: object
      properties:
        amount: { type: string }
        method: { type: string, enum: [ CASH, BANK_TRANSFER, QRIS ] }
        recordedAt: { type: string, format: date-time }

    PublicOrderResponse:
      type: object
      properties:
        orderNumber: { type: string }
        status:
          type: string
          enum: [ CONFIRMED, READY_FOR_HANDOVER, ACTIVE, RETURN_IN_PROGRESS, COMPLETED, CANCELLED ]
        totalAmount: { type: string }
        paidAmount: { type: string }
        outstandingAmount: { type: string }
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PublicPaymentResponse'

    PublicPortalSummary:
      type: object
      properties:
        totalAmount: { type: string }
        paidAmount: { type: string }
        outstandingAmount: { type: string }

    PortalExtensionRequest:
      type: object
      required: [ requestedEndAt ]
      properties:
        requestedEndAt:
          type: string
          format: date-time
          description: Harus setelah tanggal akhir sewa saat ini.
        note: { type: string, maxLength: 500 }

    MeResponse:
      type: object
      description: Profil akun self-service; hanya data milik sesi aktif.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [ PENDING_VERIFICATION, ACTIVE, DISABLED ] }
        emailVerifiedAt: { type: [ string, 'null' ], format: date-time }
        profile:
          type: object
          properties:
            ownerName: { type: [ string, 'null' ] }
            tenantName: { type: [ string, 'null' ] }
            tenantSlug: { type: [ string, 'null' ] }
        createdAt: { type: string, format: date-time }
        memberships:
          type: array
          items:
            type: object
            properties:
              tenantId: { type: string, format: uuid }
              tenantSlug: { type: string }
              tenantName: { type: string }
              role: { type: string, enum: [ OWNER, MANAGER, STAFF, CASHIER ] }

    CustomerRequest:
      type: object
      required: [ name ]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone:
          type: string
          pattern: '^[+0-9][0-9\s().-]{6,24}$'

    CustomerResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [ string, 'null' ], format: email }
        phone: { type: [ string, 'null' ] }
        isGuest: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerResponse' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    PortalOrderResponse:
      type: object
      description: >-
        Status pesanan untuk penyewa. Akses hanya dengan token acak pada path; token tidak memberi akses ke resource tenant lain.
      properties:
        tenant:
          $ref: '#/components/schemas/PublicTenantResponse'
        guestName: { type: string, nullable: true }
        reservation:
          $ref: '#/components/schemas/PublicReservationSummary'
        order:
          $ref: '#/components/schemas/PublicOrderResponse'
          nullable: true
        summary:
          $ref: '#/components/schemas/PublicPortalSummary'
        paymentMethods:
          type: array
          description: Metode yang aktif untuk konteks NEW_BOOKING.
          items:
            type: string
            enum: [ CASH, BANK_TRANSFER, QRIS ]
        inspection:
          $ref: '#/components/schemas/PortalInspectionSummary'
          nullable: true
        extensionsEnabled:
          type: boolean
          description: >-
            Toggle `rentalExtensionEnabled` tenant. `false` berarti pengajuan perpanjangan baru ditolak 422; riwayat di `extensions` tetap ditampilkan.
        extensions:
          type: array
          description: >-
            Riwayat pengajuan perpanjangan pesanan ini, terbaru lebih dulu (maks 10). Kosong bila pesanan belum dibuat.
          items: { $ref: '#/components/schemas/PortalExtensionSummary' }
        portalExpiresAt: { type: string, format: date-time }

    PortalInspectionSummary:
      type: object
      description: >-
        Hasil inspeksi terakhir yang diputuskan (APPROVED) atau sedang disanggah
        (DISPUTED). Draft internal tidak pernah tampil ke portal.
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ APPROVED, DISPUTED ] }
        penaltyAmount: { type: string }
        summary: { type: [ string, 'null' ] }
        disputeReason: { type: [ string, 'null' ] }
        disputedAt:
          type: [ string, 'null' ]
          format: date-time
        canDispute:
          type: boolean
          description: True hanya saat status APPROVED dan sengketa belum diajukan.

    PortalInspectionDisputeRequest:
      type: object
      required: [ reason ]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }

    PortalInspectionDisputeResult:
      type: object
      properties:
        status: { type: string, enum: [ DISPUTED ] }
        disputedAt:
          type: [ string, 'null' ]
          format: date-time
        reason: { type: [ string, 'null' ] }

    ResolveInspectionDisputeRequest:
      type: object
      required: [ decision ]
      properties:
        decision:
          type: string
          enum: [ UPHELD, REVISED ]
          description: UPHELD mempertahankan nominal; REVISED mewajibkan penaltyAmount.
        penaltyAmount: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 500 }

    PortalExtensionSummary:
      type: object
      description: >-
        Ringkasan permintaan perpanjangan untuk portal tamu. Tidak memuat id staf/keputusan internal.
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ PENDING_APPROVAL, APPROVED, REJECTED ] }
        previousEndAt: { type: string, format: date-time }
        requestedEndAt: { type: string, format: date-time }
        amount: { type: string }
        currency: { type: string, enum: [ IDR ] }
        createdAt: { type: string, format: date-time }
        decidedAt:
          type: [ string, 'null' ]
          format: date-time
        decisionReason:
          type: [ string, 'null' ]

    # --- Konfigurasi katalog (WEB-07) -------------------------------------

    CatalogConfigRequest:
      type: object
      description: >-
        Konfigurasi presentasi katalog. Komponen dan properti di luar allowlist ditolak 400. Harga, stok, ketersediaan, booking, pembayaran, permission, dan entitlement TIDAK dapat dititipkan di sini — semuanya tetap berasal dari domain Rentalio.
      additionalProperties: false
      properties:
        theme:
          type: object
          description: >-
            Warna (#RRGGBB atau rgb()/rgba()), fontFamily, dan gaya komponen. Opasitas 0-100 (%), blur 0-40 px.
          additionalProperties: true
        branding:
          type: object
          description: >-
            Identitas tampilan: businessName, tagline, description, logoUrl, bannerUrl, whatsappNumber, email, address.
          additionalProperties: true
        blocks:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/CatalogConfigBlock' }
        templateKey:
          type: string
          maxLength: 64

    CatalogConfigBlock:
      type: object
      description: >-
        Satu blok presentasi. `config` hanya boleh memuat properti yang terdaftar untuk tipe blok tersebut.
      required: [ type ]
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 64
          description: Unik dalam satu konfigurasi; dipakai untuk urutan & toggle.
        type:
          type: string
          enum: [ hero, categories, featured, promo_banner, testimonials, faq, how_to_book, contact_strip, stats_bar, image_banner, rich_text, video_embed, social_links, spacer ]
        enabled: { type: boolean, default: true }
        config:
          type: object
          additionalProperties: true

    CatalogConfigIssue:
      type: object
      description: Satu pelanggaran skema; `path` menunjuk blok/properti terkait.
      properties:
        path: { type: string }
        message: { type: string }

    CatalogConfigSnapshot:
      type: object
      description: Bentuk ternormalisasi yang disimpan dan dibaca publik.
      properties:
        theme: { type: object, additionalProperties: true }
        branding: { type: object, additionalProperties: true }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/CatalogConfigBlock' }

    CatalogConfigVersionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [ DRAFT, PUBLISHED, ARCHIVED ] }
        schemaVersion: { type: integer }
        templateKey: { type: string }
        blockCount: { type: integer }
        enabledBlockCount: { type: integer }
        createdByUserId:
          type: [ string, 'null' ]
          format: uuid
        publishedByUserId:
          type: [ string, 'null' ]
          format: uuid
        publishedAt:
          type: [ string, 'null' ]
          format: date-time
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CatalogConfigVersionResponse:
      allOf:
        - $ref: '#/components/schemas/CatalogConfigVersionSummary'
        - type: object
          properties:
            config: { $ref: '#/components/schemas/CatalogConfigSnapshot' }

    CatalogConfigStateResponse:
      type: object
      properties:
        draft:
          $ref: '#/components/schemas/CatalogConfigVersionResponse'
          type: [ object, 'null' ]
        published:
          $ref: '#/components/schemas/CatalogConfigVersionResponse'
          type: [ object, 'null' ]
        defaults:
          allOf:
            - $ref: '#/components/schemas/CatalogConfigSnapshot'
            - type: object
              properties:
                templateKey: { type: string }
                schemaVersion: { type: integer }

    CatalogConfigValidationResponse:
      type: object
      properties:
        valid: { type: boolean }
        schemaVersion: { type: integer }
        issues:
          type: array
          items: { $ref: '#/components/schemas/CatalogConfigIssue' }
        config:
          allOf:
            - $ref: '#/components/schemas/CatalogConfigSnapshot'
          type: [ object, 'null' ]

    CatalogConfigTemplateSummary:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [ umum, retail, kreatif, event, outdoor, proyek ] }
        blockCount: { type: integer }
        theme: { type: object, additionalProperties: true }

    CatalogConfigBlockDefinition:
      type: object
      properties:
        type: { type: string }
        label: { type: string }
        emoji: { type: string }
        description: { type: string }
        category: { type: string, enum: [ main, promo, social, media ] }
        fields:
          type: array
          items: { type: string }

    PublicCatalogConfigResponse:
      type: object
      properties:
        tenant:
          $ref: '#/components/schemas/PublicTenantResponse'
        isPublished: { type: boolean }
        version:
          type: [ integer, 'null' ]
        publishedAt:
          type: [ string, 'null' ]
          format: date-time
        templateKey: { type: string }
        schemaVersion: { type: integer }
        config: { $ref: '#/components/schemas/CatalogConfigSnapshot' }

    # --- Admin Platform (identitas global, di luar tenant) ---
    PlatformAdminChallenge:
      type: object
      required: [ challengeToken, expiresAt ]
      properties:
        challengeToken:
          type: string
          description: Token challenge sekali pakai, berlaku 5 menit.
        expiresAt:
          type: string
          format: date-time
        provisioningUri:
          type: string
          description: >-
            Hanya ada saat enrollment TOTP pertama. Dirender sebagai QR code; jangan dicatat ke log.

    PlatformAdminLoginResponse:
      type: object
      required: [ status, challenge ]
      properties:
        status:
          type: string
          enum: [ MFA_REQUIRED, MFA_ENROLLMENT_REQUIRED ]
        challenge:
          $ref: '#/components/schemas/PlatformAdminChallenge'

    PlatformAdminSessionResponse:
      type: object
      required: [ csrfToken, expiresAt ]
      properties:
        csrfToken:
          type: string
          description: >-
            Dikirim ke memori aplikasi admin dan wajib disertakan sebagai header `X-Platform-Admin-CSRF` pada setiap mutasi.
        expiresAt:
          type: string
          format: date-time
        recoveryCodes:
          type: array
          description: Hanya dikembalikan sekali saat enrollment TOTP selesai.
          items: { type: string }

    PlatformAdminPrincipal:
      type: object
      required: [ id, email, sessionId, roles, permissions ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        sessionId:
          type: string
          format: uuid
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          description: Permission efektif dari role yang tidak dicabut, dimuat backend.
          items: { type: string }
        reauthenticatedAt:
          type: [ string, 'null' ]
          format: date-time

    PlatformTenantSummary:
      type: object
      required: [ id, slug, name, status, createdAt ]
      description: >-
        Metadata minimum tenant untuk direktori admin. Data pelanggan, transaksi, katalog, dan pembayaran tenant tidak termasuk.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ PENDING_ACTIVATION, ACTIVE, SUSPENDED, CLOSED ]
        createdAt:
          type: string
          format: date-time
        trialEndsAt:
          type: [ string, 'null' ]
          format: date-time

    PlatformTenantDirectoryResponse:
      type: object
      required: [ data, page, pageSize, total ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTenantSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    PlatformTenantDetail:
      type: object
      required: [ id, slug, name, status, timezone, currency, createdAt, updatedAt ]
      description: >-
        Ringkasan satu tenant untuk admin: identitas bisnis, status, dan periode trial. Tidak memuat kontak pemilik, anggota, katalog, order, maupun data pembayaran.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ PENDING_ACTIVATION, ACTIVE, SUSPENDED, CLOSED ]
        timezone:
          type: string
        currency:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activatedAt:
          type: [ string, 'null' ]
          format: date-time
        trialEndsAt:
          type: [ string, 'null' ]
          format: date-time

    PlatformAuditEventEntry:
      type: object
      required: [ id, action, outcome, correlationId, createdAt ]
      description: >-
        Satu baris `platform_audit_events` (append-only). Metadata bersifat opsional per aksi dan tidak pernah memuat secret atau token.
      properties:
        id:
          type: string
          format: uuid
        actorAdminId:
          type: [ string, 'null' ]
          format: uuid
        action:
          type: string
        targetType:
          type: [ string, 'null' ]
        targetId:
          type: [ string, 'null' ]
        reason:
          type: [ string, 'null' ]
        outcome:
          type: string
          enum: [ SUCCESS, DENIED, FAILED ]
        correlationId:
          type: string
        metadata:
          type: [ object, 'null' ]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    PlatformAuditEventPage:
      type: object
      required: [ data, page, pageSize, total ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlatformAuditEventEntry'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    PlatformCronRunJobState:
      type: string
      enum: [ SUCCEEDED, FAILED, UNKNOWN ]

    PlatformCronRun:
      type: object
      required: [ id, startedAt, finishedAt, status, durationMs, failedJobs, results, alertedAt, jobs ]
      description: >-
        Satu putaran endpoint cron Vercel. `jobs` menurunkan status per job dari `failedJobs` dan `results`; `UNKNOWN` berarti job belum berjalan (mis. worker context gagal sebelum job dimulai). Hasil job hanya berisi hitungan operasional, bukan data tenant.
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ SUCCEEDED, PARTIAL, FAILED ]
        durationMs:
          type: integer
          minimum: 0
        failedJobs:
          type: array
          items:
            type: string
        results:
          type: [ object, 'null' ]
          additionalProperties: true
          description: Hasil per job (hitungan operasional), bukan data pelanggan.
        alertedAt:
          type: [ string, 'null' ]
          format: date-time
        jobs:
          type: object
          required: [ outbox, subscriptions, billingReminders ]
          properties:
            outbox:
              $ref: '#/components/schemas/PlatformCronRunJobState'
            subscriptions:
              $ref: '#/components/schemas/PlatformCronRunJobState'
            billingReminders:
              $ref: '#/components/schemas/PlatformCronRunJobState'

    PlatformCronRunPage:
      type: object
      required: [ data, page, pageSize, total ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlatformCronRun'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    InternalCronRunResponse:
      type: object
      required: [ status, jobs ]
      description: >-
        Hasil satu putaran cron. Nilai tiap job berbeda bentuknya dan hanya berisi hitungan operasional, bukan data pelanggan.
      properties:
        status:
          type: string
          enum: [ ok ]
        jobs:
          type: object
          required: [ outbox, subscriptions, billingReminders ]
          properties:
            outbox:
              type: object
              additionalProperties: true
            subscriptions:
              type: object
              additionalProperties: true
            billingReminders:
              type: object
              additionalProperties: true

    InternalCronRunSummary:
      type: object
      required: [ id, startedAt, finishedAt, status, durationMs, failedJobs, results, alertedAt ]
      description: Ringkasan run terakhir yang dibaca endpoint status.
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ SUCCEEDED, PARTIAL, FAILED ]
        durationMs:
          type: integer
          minimum: 0
        failedJobs:
          type: array
          items:
            type: string
        results:
          type: [ object, 'null' ]
          additionalProperties: true
        alertedAt:
          type: [ string, 'null' ]
          format: date-time

    InternalCronStatusResponse:
      type: object
      required: [ status, checkedAt, staleAfterSeconds, ageSeconds, lastRun ]
      description: >-
        Kesehatan cron beserta run terakhir. `results` dan `lastRun` dapat bernilai `null`; `UNKNOWN` tidak dipakai di sini karena status kesehatan memakai enum terpisah.
      properties:
        status:
          type: string
          enum: [ ok, degraded, stale, unknown ]
        checkedAt:
          type: string
          format: date-time
        staleAfterSeconds:
          type: integer
          minimum: 1
        ageSeconds:
          type: [ integer, 'null' ]
          minimum: 0
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/InternalCronRunSummary'
            - type: 'null'

    PlatformTenantStatusChangeRequest:
      type: object
      required: [ reason ]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: >-
            Alasan operasional yang disimpan di audit, bukan sekadar validasi UI.

    PlatformSettleSubscriptionInvoiceRequest:
      type: object
      required: [ reason ]
      additionalProperties: false
      properties:
        paidAmount:
          type: integer
          minimum: 1
          description: >-
            Nominal yang benar-benar diterima (IDR utuh). Bila kosong, dipakai nilai tagihan.
        channel:
          type: string
          maxLength: 60
          description: Kanal pembayaran yang tercatat, mis. `QRIS` atau `BCA`.
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: >-
            Referensi pembayaran (id mutasi/berita transfer) yang disimpan di audit
            platform, bukan sekadar validasi UI.

    PlatformRoleAssignmentRequest:
      type: object
      required: [ roleCode, reason ]
      additionalProperties: false
      properties:
        roleCode:
          type: string
          minLength: 2
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: >-
            Kode role di `platform_roles` (mis. `PLATFORM_SUPPORT`). Kode yang tidak ada di database dijawab `404` dan tetap diaudit.
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: >-
            Alasan operasional yang wajib disimpan di `platform_audit_events`, bukan sekadar validasi UI.

    PlatformRoleAssignmentResult:
      type: object
      required: [ adminUserId, roleCode, assignedAt, revokedAt ]
      description: >-
        Penugasan role setelah assign/revoke. `revokedAt` `null` berarti penugasan aktif; assign ulang setelah revoke menghidupkan kembali baris yang sama (unique `(adminUserId, roleId)`), jadi tidak pernah ada duplikat.
      properties:
        adminUserId:
          type: string
          format: uuid
        roleCode:
          type: string
        assignedAt:
          type: string
          format: date-time
        revokedAt:
          type: [ string, 'null' ]
          format: date-time

    PlatformAdminRoleView:
      type: object
      required: [ roleCode, roleName, assignedAt ]
      description: >-
        Satu penugasan role AKTIF milik admin. Penugasan yang sudah dicabut (`revokedAt` terisi) tidak pernah ditampilkan; riwayat tetap tersimpan di `platform_admin_roles` dan di audit.
      properties:
        roleCode:
          type: string
          description: Kode role di `platform_roles` (mis. `PLATFORM_SUPER_ADMIN`).
        roleName:
          type: string
        assignedAt:
          type: string
          format: date-time

    PlatformAdminSummary:
      type: object
      required: [ id, email, status, mfaEnrolledAt, lastLoginAt, createdAt, roles ]
      description: >-
        Identitas minimal Admin Platform beserta penugasan role aktif. Hash password, secret TOTP, sesi, dan kode pemulihan tidak pernah ikut dalam respons.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [ ACTIVE, DISABLED ]
        mfaEnrolledAt:
          type: [ string, 'null' ]
          format: date-time
          description: '`null` berarti enrollment MFA belum selesai.'
        lastLoginAt:
          type: [ string, 'null' ]
          format: date-time
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          description: Hanya penugasan role yang masih aktif.
          items:
            $ref: '#/components/schemas/PlatformAdminRoleView'

    PlatformAdminDetail:
      allOf:
        - $ref: '#/components/schemas/PlatformAdminSummary'
        - type: object
          required: [ permissions ]
          properties:
            permissions:
              type: array
              description: >-
                Kode permission efektif hasil gabungan seluruh role aktif admin (urut abjad), dihitung dari `platform_role_permissions` saat request — sama dengan yang ditegakkan guard pada request berikutnya.
              items:
                type: string

    PlatformAdminSummaryPage:
      type: object
      required: [ data, page, pageSize, total ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlatformAdminSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

  # ============================================================
  # Reusable responses
  # ============================================================
  responses:
    Unauthorized:
      description: Sesi tidak valid atau tidak ada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: >-
        Akses tidak diizinkan. Pada operasi dengan `x-subscription-restricted: blocked`, juga dikembalikan sebagai `403 TENANT_RESTRICTED` bila trial/grace berakhir atau subscription tidak aktif.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ValidationError:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    RateLimited:
      description: Terlalu banyak request
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  # ============================================================
  # Reusable parameters
  # ============================================================
  parameters:
    tenantSlug:
      name: tenantSlug
      in: path
      required: true
      description: Slug publik tenant (huruf kecil, angka, tanda hubung).
      schema:
        type: string
        pattern: '^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])?$'
    portalToken:
      name: token
      in: path
      required: true
      description: Token portal pesanan (base64url, 20-128 karakter).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{20,128}$'
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    assetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    extensionId:
      name: extensionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    conflictId:
      name: conflictId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    returnId:
      name: returnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    inspectionId:
      name: inspectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    reservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    paymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    refundId:
      name: refundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    templateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestId:
      name: requestId
      in: path
      required: true
      description: ID permintaan potongan deposit (bukan request_id korelasi).
      schema:
        type: string
        format: uuid
    movementId:
      name: movementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    collateralId:
      name: collateralId
      in: path
      required: true
      description: ID jaminan (collateral).
      schema:
        type: string
        format: uuid
    csrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    platformAdminCsrfToken:
      name: X-Platform-Admin-CSRF
      in: header
      required: true
      description: Token CSRF terikat sesi admin (dari GET /platform-admin/csrf).
      schema:
        type: string
    platformAdminId:
      name: adminId
      in: path
      required: true
      description: ID admin platform target (bukan email — mencegah enumerasi lewat input bebas).
      schema:
        type: string
        format: uuid
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opsional. Bila dikirim, request dengan key yang sama akan mengembalikan hasil yang sama tanpa membuat booking ganda (replay 24 jam). Key yang dipakai ulang dengan payload berbeda → 409 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,128}$'

  # ============================================================
  # Reusable headers
  # ============================================================
  headers:
    X-Correlation-ID:
      description: ID korelasi unik per request (identik dengan request_id di error body)
      schema:
        type: string
        format: uuid
    X-CSRF-Token:
      description: Token CSRF wajib untuk semua mutasi (diperoleh dari header respons login)
      schema:
        type: string

# ==============================================================================
# Paths
# ==============================================================================
paths:

  # ============================================================
  # Publik — alur penyewa tanpa akun (Notion 14)
  # ============================================================

  /public/resolve-host:
    x-implementation-status: implemented
    get:
      tags: [ Public ]
      operationId: resolvePublicHost
      x-required-permission: public
      summary: Resolusi tenant dari hostname kustom terverifikasi
      description: >-
        Dipakai halaman publik server-side agar katalog terbuka langsung dari domain tenant. Hostname dinormalisasi lebih dulu (huruf kecil, tanpa port dan titik akhir). Domain wajib `isActive` dan sudah memiliki `verifiedAt`; tenant wajib ACTIVE. Kegagalan apa pun dijawab 404 yang sama agar status domain/tenant tidak bocor ke publik.
      parameters:
        - name: host
          in: query
          required: true
          description: Hostname dari header Host (tanpa skema dan path).
          schema:
            type: string
            maxLength: 253
            example: sewa-kamera.example.com
      responses:
        '200':
          description: Tenant pemilik hostname
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PublicHostResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /public/{tenantSlug}/catalog:
    x-implementation-status: implemented
    get:
      tags: [ Public ]
      operationId: getPublicCatalog
      x-required-permission: public
      summary: Katalog publik tenant aktif (kategori + produk aktif)
      description: >-
        Tanpa sesi. Hanya tenant berstatus ACTIVE yang dapat diakses; tenant lain dijawab 404 tanpa membocorkan status internal. UUID tenant tidak pernah dikirim ke client.
      parameters:
        - $ref: '#/components/parameters/tenantSlug'
      responses:
        '200':
          description: Katalog publik
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PublicCatalogResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /public/{tenantSlug}/catalog-config:
    x-implementation-status: implemented
    get:
      tags: [ Public ]
      operationId: getPublicCatalogConfig
      x-required-permission: public
      summary: Konfigurasi presentasi live katalog publik
      description: >-
        Tanpa sesi. Hanya versi PUBLISHED yang dibaca; bila tenant belum pernah mempublikasikan konfigurasi, konfigurasi default dipakai sehingga storefront tetap dapat dirender. Hanya presentasi (tema, branding, blok) — harga, stok, dan ketersediaan tetap berasal dari endpoint katalog/produk. Tenant non-ACTIVE dijawab 404 tanpa membocorkan status.
      parameters:
        - $ref: '#/components/parameters/tenantSlug'
      responses:
        '200':
          description: Konfigurasi presentasi live
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PublicCatalogConfigResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /public/{tenantSlug}/products/{productId}:
    x-implementation-status: implemented
    get:
      tags: [ Public ]
      operationId: getPublicProduct
      x-required-permission: public
      summary: Detail produk publik yang aktif
      parameters:
        - $ref: '#/components/parameters/tenantSlug'
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Detail produk publik
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PublicProductDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /public/{tenantSlug}/availability:
    x-implementation-status: implemented
    get:
      tags: [ Public ]
      operationId: checkPublicAvailability
      x-required-permission: public
      summary: Ketersediaan publik untuk periode [startAt, endAt)
      description: >-
        Hasil awal bukan jaminan alokasi. Daftar unit fisik tidak pernah dikembalikan ke publik.
      parameters:
        - $ref: '#/components/parameters/tenantSlug'
        - name: productId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: startAt
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: endAt
          in: query
          required: true
          description: Akhir periode eksklusif.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Snapshot ketersediaan publik
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /public/{tenantSlug}/bookings:
    x-implementation-status: implemented
    post:
      tags: [ Public ]
      operationId: createPublicBooking
      x-required-permission: public
      summary: "Booking tamu — MANUAL: PENDING_APPROVAL; AUTOMATIC: check-and-allocate"
      description: |
        Membuat reservasi tanpa akun dan menerbitkan tautan portal pesanan.

        - Harga dihitung server dari tarif tersimpan; client tidak mengirim
          nominal apa pun.
        - Opsi A (`CHECK_AVAILABILITY`): stok kosong tetap menghasilkan
          `PENDING_APPROVAL` tanpa alokasi, termasuk pada mode AUTOMATIC.
        - Opsi B (`SKIP_AVAILABILITY`): booking saat stok kosong ditolak
          `409 AVAILABILITY_CONFLICT`; penyewa diarahkan ke WhatsApp.
        - Persetujuan syarat sewa wajib dan versinya disimpan pada reservasi.
        - Tenant restricted (trial/grace berakhir) menolak komitmen baru.
        - `Idempotency-Key` yang sama mengembalikan reservasi yang sama tanpa
          booking ganda. Tautan portal pada respons replay diterbitkan ulang
          dan tautan sebelumnya dicabut.
      parameters:
        - $ref: '#/components/parameters/tenantSlug'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicBookingRequest'
      responses:
        '201':
          description: Booking dibuat dan tautan portal diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PublicBookingResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            `AVAILABILITY_CONFLICT` bila stok tidak tersedia pada Opsi B, atau `IDEMPOTENCY_KEY_REUSED` bila key dipakai ulang dengan payload lain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          $ref: '#/components/responses/RateLimited'

  /portal/orders/{token}:
    x-implementation-status: implemented
    get:
      tags: [ Portal ]
      operationId: getPortalOrder
      x-required-permission: public
      summary: Status pesanan penyewa berbasis token
      description: >-
        Token 256-bit pada path; hanya hash yang disimpan server. Token tidak valid, kedaluwarsa, atau dicabut dijawab 404 yang sama agar tidak membocorkan keberadaan pesanan.
      parameters:
        - $ref: '#/components/parameters/portalToken'
      responses:
        '200':
          description: Ringkasan pesanan dan instruksi pembayaran
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortalOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /portal/orders/{token}/inspections/{inspectionId}/dispute:
    x-implementation-status: implemented
    post:
      tags: [ Portal ]
      operationId: disputePortalInspection
      x-required-permission: public
      summary: Sanggah hasil inspeksi lewat token pesanan
      description: >-
        Hanya inspeksi APPROVED milik pesanan token ini yang dapat disanggah.
        Status menjadi DISPUTED sehingga denda tidak bisa ditagihkan sampai
        owner/manager memutuskan ulang. Permintaan ulang bersifat idempoten.
      parameters:
        - $ref: '#/components/parameters/portalToken'
        - $ref: '#/components/parameters/inspectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalInspectionDisputeRequest' }
      responses:
        '201':
          description: Sengketa tercatat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortalInspectionDisputeResult'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Inspeksi belum disetujui sehingga tidak bisa disanggah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /portal/orders/{token}/extensions:
    x-implementation-status: implemented
    post:
      tags: [ Portal ]
      operationId: requestPortalExtension
      x-required-permission: public
      summary: Ajukan perpanjangan sewa lewat token pesanan
      description: >-
        Tamu mengajukan tanggal akhir baru tanpa sesi; token hanya memberi akses ke satu pesanan. Periode sebelumnya, biaya, dan konflik dihitung server. Permintaan berstatus `PENDING_APPROVAL` dan tidak mengubah jadwal sampai diputuskan staff. 422 bila fitur perpanjangan tenant nonaktif, 409 bila pesanan belum dibuat atau masih ada permintaan yang menunggu keputusan.
      parameters:
        - $ref: '#/components/parameters/portalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalExtensionRequest' }
      responses:
        '201':
          description: Permintaan perpanjangan tercatat menunggu keputusan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      extension: { $ref: '#/components/schemas/OrderExtensionResponse' }
                      portalExpiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Pesanan belum dibuat atau masih ada permintaan yang menunggu keputusan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '422':
          description: Fitur perpanjangan tidak aktif untuk tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ============================================================
  # Auth
  # ============================================================

  /auth/registrations:
    x-implementation-status: implemented
    post:
      tags: [ Auth ]
      operationId: registerOwner
      x-required-permission: public
      summary: Daftar OWNER — kirim OTP email
      description: |
        Mendaftarkan akun OWNER baru. Bila email sudah terdaftar dan aktif,
        server tetap merespons 202 (anti-enumerasi). OTP dikirim ke email.
        Verifikasi OTP diperlukan sebelum login dapat dilakukan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: OTP terkirim (atau akan dikirim bila email belum terdaftar)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/registrations/verify-email:
    x-implementation-status: implemented
    post:
      tags: [ Auth ]
      operationId: verifyEmail
      x-required-permission: public
      summary: Verifikasi kode OTP — tidak otomatis login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
