        Membaca `platform_audit_events` (append-only; tidak ada endpoint ubah/hapus). Urutan terbaru lebih dulu dengan `id` sebagai tiebreaker agar paginasi stabil. `from`/`to` bersifat inklusif; `from` setelah `to` dijawab `400 VALIDATION_ERROR`, begitu pula `actorAdminId` yang bukan UUID dan `action` di luar daftar aksi yang dikenal. Membaca log audit sengaja **tidak** menulis event baru: pembacaan yang menulis log akan menumbuhkan log tanpa batas dan membuka jalan log flooding. Akses dibatasi permission `platform.audit.read` + sesi admin terverifikasi MFA + `Cache-Control: no-store`.
      parameters:
        - name: actorAdminId
          in: query
          required: false
          description: Hanya event dengan aktor admin tersebut (UUID).
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - PLATFORM_ADMIN_BOOTSTRAPPED
              - PLATFORM_ADMIN_LOGIN_FAILED
              - PLATFORM_ADMIN_MFA_ENROLLMENT_STARTED
              - PLATFORM_ADMIN_MFA_ENROLLED
              - PLATFORM_ADMIN_MFA_CHALLENGE_ISSUED
              - PLATFORM_ADMIN_LOGIN_SUCCEEDED
              - PLATFORM_ADMIN_RECOVERY_CODE_USED
              - PLATFORM_ADMIN_LOGOUT
              - PLATFORM_TENANT_DIRECTORY_VIEWED
              - PLATFORM_TENANT_SUMMARY_VIEWED
              - PLATFORM_TENANT_SUSPENDED
              - PLATFORM_TENANT_REACTIVATED
              - PLATFORM_ADMIN_ROLE_ASSIGNED
              - PLATFORM_ADMIN_ROLE_REVOKED
              - PLATFORM_ADMIN_DIRECTORY_VIEWED
              - PLATFORM_ADMIN_DETAIL_VIEWED
              - PLATFORM_SUBSCRIPTION_INVOICE_SETTLED
              - PLATFORM_SUBSCRIPTION_INVOICES_VIEWED
        - name: from
          in: query
          required: false
          description: Batas bawah `createdAt` (inklusif), ISO 8601.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Batas atas `createdAt` (inklusif), ISO 8601.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Halaman event audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAuditEventPage'
        '400':
          description: Filter tidak valid (actor bukan UUID, aksi tak dikenal, rentang terbalik)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sesi admin tidak memiliki `platform.audit.read`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

