        '422':
          description: Pengguna sudah menjadi anggota aktif / akun dinonaktifkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          $ref: '#/components/responses/RateLimited'

