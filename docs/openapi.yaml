      x-required-permission: settings.subscription.manage
      summary: Buat tagihan langganan dengan QRIS dinamis
      description: >-
        Membuat tagihan pembayaran langganan tenant ke Rentalio. QRIS statis platform (`PLATFORM_QRIS_STATIC_PAYLOAD`) diubah menjadi QRIS dinamis yang sudah memuat nominal, lalu payload dan gambar QR dikembalikan. Bila masih ada tagihan `PENDING` yang belum kedaluwarsa, tagihan itu dikembalikan tanpa membuat baris/QR baru (klik ganda tidak membuat dua tagihan). Harga dan periode berasal dari konfigurasi server (`SUBSCRIPTION_PRICE_AMOUNT`, `SUBSCRIPTION_PERIOD_DAYS`); bila QRIS atau harga belum diatur dijawab `503 BILLING_NOT_CONFIGURED`. Endpoint ini **bukan** konfirmasi pembayaran: status `PAID` hanya ditetapkan operator platform lewat Admin Platform.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/csrfToken'
      responses:
        '201':
          description: Tagihan baru atau tagihan PENDING yang masih berlaku
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SubscriptionInvoiceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: QRIS platform atau harga langganan belum diatur (`BILLING_NOT_CONFIGURED`)
