        - OWNER
        - MANAGER
        - STAFF
      x-subscription-restricted: blocked
      summary: Buat reservasi — manual PENDING_APPROVAL, otomatis check-and-allocate atomik
      description: |
        Mode booking diambil dari pengaturan tenant, bukan dari body request.

        - `MANUAL`: reservasi dibuat `PENDING_APPROVAL` tanpa alokasi permanen.
        - `AUTOMATIC` + stok tersedia: check-and-allocate dalam satu transaksi
          (`SELECT ... FOR UPDATE` per produk) → `CONFIRMED`.
        - `AUTOMATIC` + stok tidak tersedia + `CHECK_AVAILABILITY`: diterima
          sebagai `PENDING_APPROVAL` tanpa alokasi (Opsi A).
        - `AUTOMATIC` + stok tidak tersedia + `SKIP_AVAILABILITY`: ditolak
          `409 AVAILABILITY_CONFLICT` (Opsi B).

        Tidak pernah ada alokasi parsial: kegagalan salah satu item
        membatalkan seluruh transaksi. Harga dihitung server dari Rate.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/csrfToken'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
