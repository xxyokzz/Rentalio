        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            `AVAILABILITY_CONFLICT` bila stok tidak tersedia (Opsi B), atau `IDEMPOTENCY_KEY_REUSED` bila Idempotency-Key dipakai ulang dengan payload berbeda.
          content:
            application/json:
