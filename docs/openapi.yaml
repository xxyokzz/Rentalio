  /platform-admin/admins/{adminId}/roles/assign:
    x-implementation-status: implemented
    post:
      tags: [ Platform Admin ]
      operationId: platformAdminAssignRole
      x-required-permission: platform.roles.assign
      security:
        - platformAdminCookie: []
      summary: Tugaskan role ke admin — wajib alasan, CSRF admin, dan audit
      description: >-
        Menambahkan (atau menghidupkan kembali) penugasan `platform_admin_roles`. `roleCode` divalidasi terhadap tabel `platform_roles`; admin target maupun role yang tidak ditemukan dijawab `404` dan tetap tercatat di audit dengan `outcome: FAILED`. Role yang sudah aktif dijawab `409 INVALID_STATE_TRANSITION`. Proteksi anti-lockout: menugaskan role ke diri sendiri dijawab `422 BUSINESS_RULE_VIOLATION` (mencegah eskalasi privilese mandiri) dan tetap diaudit `FAILED`. `reason` wajib 10–500 karakter dan disimpan pada kolom `reason` audit. Mutasi dan audit berada dalam satu transaksi; pembacaan permission kemudian dihitung ulang dari database pada setiap permintaan sesi.
      parameters:
        - $ref: '#/components/parameters/platformAdminId'
        - $ref: '#/components/parameters/platformAdminCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformRoleAssignmentRequest'
      responses:
        '200':
          description: Penugasan aktif; baris assignment terbaru dikembalikan
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    $ref: '#/components/schemas/PlatformRoleAssignmentResult'
        '400':
          description: Body tidak valid (alasan kurang dari 10 karakter, roleCode bukan format kode) atau adminId bukan UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Tidak memiliki `platform.roles.assign`, atau Origin/token CSRF admin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Admin target atau role tidak ditemukan (diaudit sebagai FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Role sudah ditugaskan ke admin tersebut, atau terjadi balapan perubahan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: >-
            Proteksi anti-lockout: aktor mencoba menugaskan role ke diri sendiri (`SELF_ASSIGNMENT`). Ditolak `422 BUSINESS_RULE_VIOLATION` dan tetap tercatat di audit dengan `outcome: FAILED` beserta alasan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /platform-admin/admins/{adminId}/roles/revoke:
    x-implementation-status: implemented
    post:
      tags: [ Platform Admin ]
      operationId: platformAdminRevokeRole
      x-required-permission: platform.roles.revoke
      security:
        - platformAdminCookie: []
      summary: Cabut role dari admin — alasan wajib, permission terpisah, audit
      description: >-
        Menandai penugasan aktif dengan `revokedAt` (baris tetap ada sebagai riwayat, tanpa DELETE). Permission terpisah dari `platform.roles.assign` agar kewenangan dapat dipisah per role. Penugasan yang tidak ada dijawab `404`, yang sudah dicabut dijawab `409`, dan keduanya tetap tercatat `PLATFORM_ADMIN_ROLE_REVOKED` dengan `outcome: FAILED` beserta alasan. Proteksi anti-lockout: mencabut penugasan `PLATFORM_SUPER_ADMIN` terakhir dijawab `422 BUSINESS_RULE_VIOLATION` — baris penugasan super admin dikunci (`FOR UPDATE`) dalam transaksi sehingga dua pencabutan bersamaan tidak dapat mengosongkan seluruh super admin. Permission efektif sesi berikutnya langsung berkurang karena dihitung ulang dari database.
      parameters:
        - $ref: '#/components/parameters/platformAdminId'
        - $ref: '#/components/parameters/platformAdminCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformRoleAssignmentRequest'
      responses:
        '200':
          description: Penugasan dicabut; baris assignment terbaru dikembalikan
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    $ref: '#/components/schemas/PlatformRoleAssignmentResult'
        '400':
          description: Body tidak valid (alasan kurang dari 10 karakter, roleCode bukan format kode) atau adminId bukan UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Tidak memiliki `platform.roles.revoke`, atau Origin/token CSRF admin tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Admin target, role, atau penugasan tidak ditemukan (diaudit sebagai FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Penugasan sudah dicabut sebelumnya, atau terjadi balapan perubahan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: >-
            Proteksi anti-lockout: penugasan `PLATFORM_SUPER_ADMIN` terakhir tidak dapat dicabut (`LAST_SUPER_ADMIN`). Ditolak `422 BUSINESS_RULE_VIOLATION` dan tetap tercatat di audit dengan `outcome: FAILED` beserta alasan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

# ============================================================
# Tags
# ============================================================
tags:
  - name: Public
    description: |
      Katalog publik dan booking tamu tanpa akun (Notion 14). Tidak memakai
      sesi; tenant diresolusi dari slug. Data yang dikembalikan hanya yang
      boleh dilihat penyewa.
  - name: Portal
    description: |
      Portal pesanan penyewa berbasis token acak. Token terbatas pada satu
      pesanan dan tidak memberi akses ke resource tenant lain.
  - name: Auth
    description: Autentikasi, registrasi OWNER, manajemen sesi
  - name: Tenant
    description: Manajemen tenant dan keanggotaan (membership)
  - name: Catalog
    description: Kategori dan produk (katalog sewa)
  - name: Inventory
    description: Unit fisik (asset), tarif, dan maintenance
  - name: Health
    description: Probe liveness dan readiness (tanpa autentikasi)
  - name: Reservation
    description: |
      Reservasi dan ketersediaan (ADR-001 §1). Anti double-booking dijaga
      oleh lock produk, alokasi atomik, dan exclusion constraint PostgreSQL.
  - name: Order
    description: |
      Rental order dan lifecycle operasional (ADR-001 §3): konversi reservasi,
      serah-terima, dan penyelesaian. Status order terpisah dari status booking
      dan status pembayaran.
  - name: Payment
    description: |
      Pembayaran sewa manual (ADR-001 §4). MVP offline: RECORDED/VOIDED, tanpa
      payment gateway. Histori tidak dihapus; koreksi lewat void + audit.
  - name: Deposit
    description: |
      Ledger deposit append-only (RECEIPT/DEDUCTION/REFUND/REVERSAL). Saldo
      dihitung dari movement, potongan memerlukan approval aktor lain, dan
      refund deposit terpisah dari refund pembayaran sewa.
  - name: Collateral
    description: |
      Jaminan non-uang penyewa pada order. Jaminan utama adalah ID card
      (ID_CARD, maksimal satu HELD); jaminan lain (OTHER) opsional. Jaminan
      uang tidak memakai tag ini — nominalnya dipegang oleh ledger deposit.
      Riwayat tidak dihapus; pengembalian ditandai lewat status RETURNED.
  - name: Extension
    description: |
      Perpanjangan sewa (ADR-001 §8). Pengajuan tidak mengubah periode;
      perubahan periode + alokasi hanya pada approval atomik. Opsi B hanya
      dapat meneruskan konflik melalui override eksplisit berizin dengan
      alasan, konfirmasi risiko, audit, flag order, dan tugas operasional.
  - name: Return & Inspection
    description: |
      Pengembalian barang dan inspeksi kerusakan (ADR-001 §5).
      Alur: catat return → selesaikan pengembalian → inspeksi DRAFT →
      diajukan → diputuskan (APPROVED/REJECTED). Lampiran R2 masih future.
  - name: Platform Admin
    description: |
      Identitas, sesi, dan otorisasi Admin Platform — terpisah total dari user
      dan membership tenant. Cookie `rentalio_platform_admin` host-only untuk
      origin aplikasi admin; sesi tenant tidak pernah diterima sebagai bukti
      identitas admin. Setiap operasi wajib mendeklarasikan permission
      `platform.*` (deny-by-default), dan semua mutasi wajib CSRF + Origin
      admin yang persis.
  - name: Internal
    description: |
      Endpoint operasional yang dipanggil scheduler/infrastruktur, bukan
      pengguna. Diautentikasi shared secret (`Authorization: Bearer ...`), tidak
      memakai cookie sesi, dan tidak pernah mengembalikan data tenant.
