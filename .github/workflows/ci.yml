# CI Rentalio — gate kualitas untuk setiap push dan pull request.
#
# Gate yang dijalankan (berurutan, gagal cepat):
#   0. bash scripts/actionlint.sh — statik check workflow ini sendiri
#      (syntax, tipe ekspresi ${{ }}, input action, shellcheck pada run:)
#   1. pnpm openapi:validate  — kontrak OpenAPI 3.1.1 + aturan status implementasi
#   2. pnpm typecheck         — TypeScript strict
#   3. pnpm lint              — ESLint (error = gagal; warning tidak)
#   4. pnpm build             — tsc build semua package
#   5. pnpm test              — unit + integration terhadap PostgreSQL 18 sungguhan
#                               (globalSetup membangun schema dari database kosong)
#   6. Playwright e2e         — UI desktop terhadap API + web yang berjalan sungguhan,
#                               memakai fixture dari `pnpm qa:seed:e2e`
#
# Prasyarat Gate 2: Prisma client dan `dist` paket database di-generate lebih
# dulu. Keduanya di-gitignore, jadi runner bersih tidak memilikinya, sedangkan
# `@rentalio/database` mengekspor tipe dari `dist/index.d.ts` — tanpa langkah
# ini typecheck apps/api berhenti dengan TS2307 "Cannot find module
# '@rentalio/database'".
#
# Dependensi lockfile dikunci via `pnpm install --frozen-lockfile`; versi Node
# dibaca dari `.node-version` dan pnpm dari `packageManager` — jangan diduplikasi
# di berkas ini.
#
# Catatan: workspace ini belum menjadi repository Git. Berkas siap dipakai
# begitu repo di-push ke GitHub; pengecekan lokal (parse + bootstrap SQL) sudah
# dilakukan dan didokumentasikan di README.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Minimal privilege: cukup membaca isi repository.
permissions:
  contents: read

# Satu run per ref; run lama dibatalkan saat ada push baru.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Gate kualitas — openapi, typecheck, lint, build, test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          # Sama dengan pengembangan lokal (trust untuk localhost):
          # tanpa password, kredensial diperiksa lewat role di database.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gate 0 berjalan paling awal: gagal cepat saat workflow ini sendiri rusak,
      # bahkan sebelum dependensi di-install. Pemakai binari actionlint yang sama
      # dengan lokal (`pnpm actionlint`), dipin lewat ACTIONLINT_VERSION di skrip.
      - name: Gate 0 — actionlint (validasi workflow)
        run: bash scripts/actionlint.sh

      # pnpm diambil dari field `packageManager` (pnpm@11.9.0) — tanpa input versi
      # agar tidak ada dua sumber kebenaran.
      - name: Siapkan pnpm
        uses: pnpm/action-setup@v6

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependensi (lockfile terkunci)
        run: pnpm install --frozen-lockfile

      # Role runtime & migrator + database test dibuat idempoten oleh SQL ini;
      # migrasi yang dijalankan test gagal dengan pesan jelas bila role kurang.
      # `-i` WAJIB agar stdin ter-attach ke container — tanpa itu SQL yang
      # disalurkan lewat `<` dibuang diam-diam dan bootstrap tampak "sukses".
      - name: Siapkan PostgreSQL (role & database test)
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -v ON_ERROR_STOP=1 \
            < scripts/ci/bootstrap-postgres.sql

      - name: Gate 1 — validasi kontrak OpenAPI
        run: pnpm openapi:validate

      # `prisma generate` menulis client ke database/src/generated, lalu tsc
      # mengompilasi paket menjadi dist/index.d.ts. Keduanya di-gitignore dan
      # belum ada di runner, jadi harus dibuat sebelum Gate 2 me-resolve tipe
      # `@rentalio/database` dari apps/api.
      - name: Siapkan Prisma client & build paket database
        run: |
          pnpm db:generate
          pnpm --filter @rentalio/database build
        env:
          # Generate tidak menyambung ke database, tetapi prisma.config.ts
          # mewajibkan URL teresolusi (DIRECT_URL kosong di CI). Nilainya sama
          # dengan database test pada Gate 5.
          DATABASE_URL: postgresql://sewain_dev@localhost:5432/sewain_test?schema=public

      - name: Gate 2 — typecheck
        run: pnpm typecheck

      - name: Gate 3 — lint
        run: pnpm lint

      - name: Gate 4 — build
        run: pnpm build

      # Test menjalankan globalSetup: reset schema sewain_test lalu
      # `prisma migrate deploy` dari database kosong (membuktikan migrasi
      # reproducible), kemudian seluruh unit + integration test.
      - name: Gate 5 — unit & integration test (PostgreSQL)
        run: pnpm test
        env:
          MIGRATOR_TEST_URL: postgresql://sewain_migrator@localhost:5432/sewain_test
          DATABASE_URL: postgresql://sewain_dev@localhost:5432/sewain_test?schema=public

      # Gate 6 — e2e UI. Schema sudah dimigrasikan Gate 5 (globalSetup), jadi langkah
      # ini hanya menambah fixture: akun demo, tenant `demo-sewa`, katalog, dan
      # langganan ACTIVE (tanpa itu simpan draf katalog ditolak 403 TENANT_RESTRICTED).
      # API dijalankan dari `dist` hasil Gate 4; web dev server dikelola Playwright
      # lewat `webServer` di playwright.config.ts (port 3001).
      #
      # EMAIL_PROVIDER=in-memory membuat `apps/api/.dev-mailbox/outbox.jsonl` tidak ada,
      # sehingga `billing_qris.spec.ts` melewati dirinya sendiri alih-alih menguji alur
      # QRIS yang butuh konfigurasi provider. NODE_ENV=test hanya untuk proses API ini;
      # langkah Playwright sengaja tanpa NODE_ENV agar `next dev` berjalan normal.
      - name: Gate 6 — siapkan fixture & API untuk e2e
        run: |
          mkdir -p .dev-logs
          pnpm qa:seed:e2e
          # nohup + stdin /dev/null agar proses latar tidak menahan langkah ini.
          (cd apps/api && nohup node dist/main.js > ../../.dev-logs/api-e2e.log 2>&1 < /dev/null &)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/health/ready > /dev/null; then
              echo "API e2e siap setelah ${i} detik"
              exit 0
            fi
            sleep 1
          done
          echo "API e2e tidak siap dalam 60 detik" >&2
          tail -50 .dev-logs/api-e2e.log >&2
          exit 1
        env:
          DATABASE_URL: postgresql://sewain_dev@localhost:5432/sewain_test?schema=public
          NODE_ENV: test
          PORT: 3000
          EMAIL_PROVIDER: in-memory
          # Hanya untuk CI: pepper >= 32 karakter, bukan rahasia produksi.
          HMAC_PEPPER: ci-e2e-hmac-pepper-bukan-rahasia-produksi

      # Cache browser Playwright (~170 MB Chromium) antar run. Key memakai versi
      # Playwright, bukan hash lockfile: perubahan dependensi lain tidak perlu
      # membatalkan cache, sedangkan menaikkan Playwright otomatis membuat key baru
      # sehingga binari lama tidak pernah dipakai bersama versi paket yang berbeda.
      - name: Baca versi Playwright
        id: pw
        run: echo "version=$(pnpm --filter @rentalio/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache browser Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-

      # Dependency sistem (libnss3, fonts, dsb.) tetap dipasang tiap run karena
      # image runner bisa berubah; biayanya kecil dibanding unduhan browser.
      - name: Dependency sistem Playwright
        run: pnpm --filter @rentalio/web exec playwright install-deps chromium

      - name: Pasang Chromium (hanya saat cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @rentalio/web exec playwright install chromium

      - name: Gate 6 — e2e Playwright (desktop)
        run: pnpm --filter @rentalio/web test:e2e --project=desktop

      # Laporan HTML, trace/screenshot Playwright, dan log API ikut diunggah agar
      # kegagalan e2e bisa didiagnosis tanpa menjalankan ulang di mesin lokal.
      - name: Unggah artefak e2e (hanya saat gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefak
          path: |
            apps/web/playwright-report
            apps/web/test-results
            .dev-logs/api-e2e.log
          if-no-files-found: ignore
          retention-days: 7
